apiVersion: apps/v1
kind: Deployment
metadata:
  name: cas-client-demo
  namespace: aidp-iam
  labels:
    app: cas-client-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cas-client-demo
  template:
    metadata:
      labels:
        app: cas-client-demo
    spec:
      containers:
      - name: cas-client-demo
        image: cas-client-demo:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: KEYCLOAK_BASE_URL
          value: http://localhost:30080
        - name: REALM
          value: aidp
        - name: SERVICE_URL
          value: http://localhost:18080/cas/callback
        ports:
        - name: http
          containerPort: 18080
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cas-client-demo
  namespace: aidp-iam
  labels:
    app: cas-client-demo
spec:
  selector:
    app: cas-client-demo
  ports:
  - name: http
    port: 18080
    targetPort: http
