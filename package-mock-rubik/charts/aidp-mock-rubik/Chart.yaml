apiVersion: v2
name: aidp-mock-rubik
description: |
  Mock Rubik (data analysis) backend for AIDP IAM. Wraps mock-rubik FastAPI image
  + HTTPRoute (/rubik prefix, URL-rewritten to /) + ReferenceGrant + SecurityPolicy +
  EnvoyExtensionPolicy in a single Helm release.

  Doubles as IAM e2e test pod and standard chart structure for any
  business that uses path-based IDs (DELETE /api/databases/{id}).

  Requires aidp-gateway and aidp-iam already installed.
  Rubik app metadata is bootstrapped by the keycloak-init Job in aidp-iam.
type: application
version: 1.0.0
appVersion: "1.0.0"
