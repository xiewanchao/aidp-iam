apiVersion: v2
name: aidp-mock-kb
description: |
  Mock Knowledge Base backend for AIDP IAM. Wraps mock-kb FastAPI image
  + HTTPRoute (/kb prefix) + ReferenceGrant + SecurityPolicy + EnvoyExtensionPolicy
  in a single Helm release.

  Doubles as:
    - IAM platform e2e test pod (verify ext_authz / ext_proc / ACL auto-sync)
    - Standard chart structure reference for any new business chart

  Requires aidp-gateway and aidp-iam already installed (Gateway 'eg' in
  envoy-gateway-system; pep-proxy / resource-sync running in the merged
  aidp-iam namespace, v1.4 layout).

  KB app metadata (apps / resource_patterns / path_rules) is bootstrapped by
  the keycloak-init Job in aidp-iam — this chart only deploys K8s resources.
type: application
version: 1.1.1
appVersion: "1.1.0"
