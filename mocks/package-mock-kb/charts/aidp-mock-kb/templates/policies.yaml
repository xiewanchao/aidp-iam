{{/*
SecurityPolicy: bind mock-kb route to ext_authz (pep-proxy in aidp-iam ns,
v1.4 merged layout). Uses its own name so it doesn't conflict with aidp-iam's
pep-proxy-extauthz.

EnvoyExtensionPolicy: bind mock-kb route to ext_proc (resource-sync, also
aidp-iam ns) for ACL auto-sync — POST 201 → write owner; DELETE → cascade.
Body Streamed mode is required because resource-sync needs the response body
to extract resource IDs.
*/}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mock-kb-extauthz
  namespace: envoy-gateway-system
  labels:
    {{- include "aidp-mock-kb.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-kb-route
  extAuth:
    grpc:
      backendRefs:
      - name: pep-proxy
        namespace: aidp-iam
        port: 9000
    failOpen: false
    bodyToExtAuth:
      maxRequestBytes: 8192
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: mock-kb-extproc
  namespace: envoy-gateway-system
  labels:
    {{- include "aidp-mock-kb.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-kb-route
  extProc:
  - backendRefs:
    - name: resource-sync
      namespace: aidp-iam
      port: 8082
    processingMode:
      request:
        body: Streamed
      response:
        body: Streamed
    failOpen: true
