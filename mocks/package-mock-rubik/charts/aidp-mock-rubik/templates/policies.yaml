---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mock-rubik-extauthz
  namespace: envoy-gateway-system
  labels:
    {{- include "aidp-mock-rubik.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-rubik-route
  extAuth:
    grpc:
      backendRefs:
      - name: pep-proxy
        namespace: aidp-iam
        port: 9000
    failOpen: false
    bodyToExtAuth:
      maxRequestBytes: 8192
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: mock-rubik-extproc
  namespace: envoy-gateway-system
  labels:
    {{- include "aidp-mock-rubik.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-rubik-route
  extProc:
  - backendRefs:
    - name: resource-sync
      namespace: aidp-iam
      port: 8082
    processingMode:
      request:
        body: Streamed
      response:
        body: Streamed
    failOpen: true
