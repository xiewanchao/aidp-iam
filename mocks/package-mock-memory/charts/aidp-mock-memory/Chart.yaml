apiVersion: v2
name: aidp-mock-memory
description: |
  Mock Memory backend for AIDP IAM. Wraps mock-memory FastAPI image
  + HTTPRoute (/memory prefix, URL-rewritten to /) + ReferenceGrant +
  SecurityPolicy + EnvoyExtensionPolicy in a single Helm release.

  Doubles as IAM e2e test pod and standard chart structure for any
  business with default RESTful API (POST 201 + GET/PUT/DELETE on /id).

  Requires aidp-gateway and aidp-iam already installed.
  Memory app metadata is bootstrapped by the keycloak-init Job in aidp-iam.
type: application
version: 1.1.0
appVersion: "1.1.0"
