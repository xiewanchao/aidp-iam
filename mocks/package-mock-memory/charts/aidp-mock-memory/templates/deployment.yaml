apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-memory
  namespace: {{ .Values.namespace }}
  labels:
    app: mock-memory
    {{- include "aidp-mock-memory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: mock-memory
  template:
    metadata:
      labels:
        app: mock-memory
    spec:
      containers:
      - name: mock-memory
        image: {{ .Values.image }}
        imagePullPolicy: {{ .Values.pullPolicy }}
        ports:
        - containerPort: {{ .Values.port }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.port }}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.port }}
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mock-memory
  namespace: {{ .Values.namespace }}
  labels:
    app: mock-memory
    {{- include "aidp-mock-memory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
    name: http
  selector:
    app: mock-memory
