apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-memory-route
  namespace: envoy-gateway-system
  labels:
    {{- include "aidp-mock-memory.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.pathPrefix }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: mock-memory
      namespace: {{ .Values.namespace }}
      port: {{ .Values.port }}
