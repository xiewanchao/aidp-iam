apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-memory-route
  namespace: {{ .Values.gatewayNamespace }}
  labels:
    {{- include "aidp-mock-memory.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.pathPrefix }}
    backendRefs:
    - name: mock-memory
      namespace: {{ .Values.namespace }}
      port: {{ .Values.port }}
---
# Separate route for /health — no SecurityPolicy attached so no auth required.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-memory-health-route
  namespace: {{ .Values.gatewayNamespace }}
  labels:
    {{- include "aidp-mock-memory.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: Exact
        value: {{ .Values.pathPrefix }}/health
    backendRefs:
    - name: mock-memory
      namespace: {{ .Values.namespace }}
      port: {{ .Values.port }}
