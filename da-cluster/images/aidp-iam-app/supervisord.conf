; aidp-iam-app: 4 Python services under one supervisord
; (keycloak-proxy + pep-proxy + bundle-server + resource-sync)

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── keycloak-proxy: Admin API for users/groups/apps/IDPs/API Keys ──
[program:keycloak-proxy]
command=python3 /app/app/main.py
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/keycloak-proxy.log
stderr_logfile=/var/log/supervisor/keycloak-proxy.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── pep-proxy: HTTP /health + path-rules CRUD on :8000, gRPC ext_authz on :9000 ──
[program:pep-proxy]
command=uvicorn pep_proxy.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/pep-proxy.log
stderr_logfile=/var/log/supervisor/pep-proxy.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── bundle-server: compiles iam DB → OPA Rego/data, pushes to localhost:8181 ──
[program:bundle-server]
command=uvicorn bundle_server.main:app --host 0.0.0.0 --port 8001
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/bundle-server.log
stderr_logfile=/var/log/supervisor/bundle-server.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── resource-sync: HTTP /health + ACL CRUD on :8080, gRPC ext_proc on :8082 ──
; Run via uvicorn directly — the inline `python -m resource_sync.main` path
; calls `uvicorn.run("app.main:app", ...)` which collides with keycloak-proxy
; (whose code lives at /app/app/main.py). FastAPI's @on_event("startup")
; spins up the ext_proc gRPC listener on 8082 alongside the HTTP server.
[program:resource-sync]
command=uvicorn resource_sync.main:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/resource-sync.log
stderr_logfile=/var/log/supervisor/resource-sync.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
