# Allow envoy-gateway-system to reference Services in keycloak namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-keycloak
  namespace: keycloak
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
# Allow envoy-gateway-system to reference Services in opa namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-opa
  namespace: opa
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: EnvoyExtensionPolicy
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
