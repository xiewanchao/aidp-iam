# ============================================================================
# Protected routes: go through ext_authz (pep-proxy) and optionally ext_proc
# (resource-sync) for business routes.
#
# Envoy Gateway forwards request body (up to 8 KiB) to ext_authz so pep-proxy
# can extract resource IDs from JSON bodies (flexible API adaptation).
# ============================================================================

# ── Keycloak-proxy tenant/common management ────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-proxy-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/tenants
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - X-Auth-User-Id
        - X-Auth-Tenant
        - X-Auth-Groups
        - X-Allowed-Ids
        - X-Allowed-Total
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/common
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
---
# ── Identity management (roles / groups / users / idp / api-keys / apps) ───
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-api-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/roles(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/groups(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/users(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/idp(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/api-keys(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/apps(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
---
# ── Resource ACL API (resource-sync) ───────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acl-api-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /acl/v1
    backendRefs:
    - name: resource-sync
      namespace: resource-sync
      port: 8080
---
# ── Path rules CRUD (pep-proxy) ────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-rules-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/path-rules
    backendRefs:
    - name: pep-proxy
      namespace: opa
      port: 8000
---
# ── Business API (ext_authz + ext_proc) — default tenant catch-all ─────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-api-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /anything
    backendRefs:
    - name: httpbin
      namespace: httpbin
      port: 8000
---
# ── Legacy app URL rewrite example ─────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy-app-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /legacy/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /anything
    backendRefs:
    - name: httpbin
      namespace: httpbin
      port: 8000
---
# ── SecurityPolicy: ext_authz → pep-proxy (gRPC, with request body) ────────
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pep-proxy-extauthz
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: keycloak-proxy-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: identity-api-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: acl-api-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: path-rules-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant-api-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: legacy-app-route
  extAuth:
    grpc:
      backendRefs:
      - name: pep-proxy
        namespace: opa
        port: 9000
    failOpen: false
    bodyToExtAuth:
      maxRequestBytes: 8192
---
# ── EnvoyExtensionPolicy: ext_proc → resource-sync (streaming body) ────────
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: resource-sync-extproc
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tenant-api-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: legacy-app-route
  extProc:
  - backendRefs:
    - name: resource-sync
      namespace: resource-sync
      port: 8082
    processingMode:
      request:
        body: Streamed
      response:
        body: Streamed
    failOpen: true
