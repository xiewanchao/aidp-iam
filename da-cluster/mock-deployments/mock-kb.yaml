# Mock KB backend for isula deployments that want to exercise
# the KB authz path end-to-end. Apply with: kubectl apply -f mock-kb.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: mock-kb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-kb
  namespace: mock-kb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-kb
  template:
    metadata:
      labels:
        app: mock-kb
    spec:
      containers:
      - name: mock-kb
        image: mock-kb:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mock-kb
  namespace: mock-kb
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: mock-kb
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mock-kb-from-envoy
  namespace: mock-kb
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-kb-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /kb/
    backendRefs:
    - name: mock-kb
      namespace: mock-kb
      port: 8080
