# Mock Memory backend for isula deployments.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mock-memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-memory
  namespace: mock-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-memory
  template:
    metadata:
      labels:
        app: mock-memory
    spec:
      containers:
      - name: mock-memory
        image: mock-memory:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        readinessProbe:
          httpGet: {path: /api/v1/health, port: 8082}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: {path: /api/v1/health, port: 8082}
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mock-memory
  namespace: mock-memory
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8082
    name: http
  selector:
    app: mock-memory
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mock-memory-from-envoy
  namespace: mock-memory
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-memory-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /memory/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: mock-memory
      namespace: mock-memory
      port: 8080
