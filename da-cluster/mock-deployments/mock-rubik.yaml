# Mock Rubik backend for isula deployments.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mock-rubik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-rubik
  namespace: mock-rubik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-rubik
  template:
    metadata:
      labels:
        app: mock-rubik
    spec:
      containers:
      - name: mock-rubik
        image: mock-rubik:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet: {path: /health, port: 8081}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: {path: /health, port: 8081}
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mock-rubik
  namespace: mock-rubik
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8081
    name: http
  selector:
    app: mock-rubik
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mock-rubik-from-envoy
  namespace: mock-rubik
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-rubik-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /rubik/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: mock-rubik
      namespace: mock-rubik
      port: 8080
