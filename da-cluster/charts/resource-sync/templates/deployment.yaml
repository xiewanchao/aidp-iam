apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: resource-sync
    {{- include "resource-sync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: resource-sync
  template:
    metadata:
      labels:
        app: resource-sync
    spec:
      containers:
      - name: resource-sync
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8082
          name: grpc-extproc
        env:
        - name: IAM_DB_URL
          value: "{{ .Values.env.IAM_DB_URL }}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
