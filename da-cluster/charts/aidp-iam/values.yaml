# ============================================================================
# AIDP IAM umbrella chart values
# ============================================================================
# Each subchart still deploys to its own (hardcoded) namespace:
#   envoy-gateway-system / keycloak / opa / resource-sync / mock-kb / mock-rubik
# This chart creates those namespaces as a pre-install hook and then installs
# each subchart. Override any subchart value below.
# ============================================================================

# Enable/disable each subchart. Keys MUST match the chart `name` in dependencies.
gateway-helm:
  enabled: true
  deployment:
    envoyGateway:
      image:
        pullPolicy: IfNotPresent

envoy-gateway:
  enabled: true
  gateway:
    name: eg
    className: eg
    port: 80
  proxy:
    image: docker.io/envoyproxy/envoy:distroless-v1.37.0
    imagePullPolicy: IfNotPresent
    replicas: 1
    service:
      # NodePort so the gateway is reachable at <node-ip>:<nodePort>
      # (or <EIP>:<nodePort> when Huawei Cloud / bare-metal uses an EIP-NAT).
      # Switch to ClusterIP if you already have an ingress / LB in front.
      type: NodePort
      nodePort: 30080

keycloak:
  enabled: true

opa:
  enabled: true

resource-sync:
  enabled: true
  image:
    repository: resource-sync
    tag: v1
    pullPolicy: IfNotPresent

# Gateway routes + mock backends (rendered from this umbrella's templates)
routes:
  enabled: true

# Mock backends for E2E testing
mocks:
  kb:
    enabled: true
    namespace: mock-kb
    image: mock-kb:v1
    port: 8080
  rubik:
    enabled: true
    namespace: mock-rubik
    image: mock-rubik:v1
    port: 8081
  memory:
    enabled: true
    namespace: mock-memory
    image: mock-memory:v1
    port: 8082
