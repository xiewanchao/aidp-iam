{{/*
Create namespaces needed by the subcharts.

Do not render namespaces as Helm hooks. A hook with before-hook-creation deletes
the namespace on every upgrade, which also deletes namespaced PVCs and data.
*/}}
{{- $names := list "envoy-gateway-system" "keycloak" "opa" "resource-sync" -}}
{{- if and .Values.routes.enabled .Values.mocks.kb.enabled -}}
  {{- $names = append $names .Values.mocks.kb.namespace -}}
{{- end -}}
{{- if and .Values.routes.enabled .Values.mocks.rubik.enabled -}}
  {{- $names = append $names .Values.mocks.rubik.namespace -}}
{{- end -}}
{{- if and .Values.routes.enabled .Values.mocks.memory.enabled -}}
  {{- $names = append $names .Values.mocks.memory.namespace -}}
{{- end -}}
{{- range $ns := $names }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: aidp-iam
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
{{- end }}
