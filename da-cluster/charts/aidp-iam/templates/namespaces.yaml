{{- /*
Create all namespaces needed by the subcharts. Rendered as a pre-install
hook so that namespaces exist before Helm applies any subchart template.
*/ -}}
{{- $names := list "envoy-gateway-system" "keycloak" "opa" "resource-sync" -}}
{{- if and .Values.routes.enabled .Values.routes.httpbin.enabled -}}
  {{- $names = append $names .Values.routes.httpbin.namespace -}}
{{- end -}}
{{- range $ns := $names }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- end }}
