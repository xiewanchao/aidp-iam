{{- if and .Values.routes.enabled .Values.mocks.kb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-kb
  namespace: {{ .Values.mocks.kb.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-kb
  template:
    metadata:
      labels:
        app: mock-kb
    spec:
      containers:
      - name: mock-kb
        image: {{ .Values.mocks.kb.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.mocks.kb.port }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.mocks.kb.port }}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.mocks.kb.port }}
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mock-kb
  namespace: {{ .Values.mocks.kb.namespace }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: {{ .Values.mocks.kb.port }}
    name: http
  selector:
    app: mock-kb
{{- end }}
