{{- /*
Gateway routes — HTTPRoutes, SecurityPolicy, EnvoyExtensionPolicy,
and ReferenceGrants. Rendered only when .Values.routes.enabled is true.

These manifests must be applied AFTER the Envoy Gateway controller has
installed its CRDs and is ready, so we tag them as post-install hooks
with a high weight.
*/ -}}
{{- if .Values.routes.enabled }}
---
# Allow envoy-gateway-system to reference Services in keycloak namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-keycloak
  namespace: keycloak
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
# Allow envoy-gateway-system to reference Services in opa namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-opa
  namespace: opa
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: EnvoyExtensionPolicy
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
# Allow envoy-gateway-system to reference Services in resource-sync namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-resource-sync
  namespace: resource-sync
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: EnvoyExtensionPolicy
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
{{- if .Values.mocks.kb.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-mock-kb
  namespace: {{ .Values.mocks.kb.namespace }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
{{- end }}
{{- if .Values.mocks.rubik.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-mock-rubik
  namespace: {{ .Values.mocks.rubik.namespace }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
{{- end }}
{{- if .Values.mocks.memory.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-mock-memory
  namespace: {{ .Values.mocks.memory.namespace }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
{{- end }}
---
# Keycloak OIDC endpoints (no auth)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /realms
    backendRefs:
    - name: keycloak
      namespace: keycloak
      port: 8080
---
# Keycloak admin console (no auth)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    backendRefs:
    - name: keycloak
      namespace: keycloak
      port: 8080
---
# Keycloak static resources (no auth)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-static-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /resources
    backendRefs:
    - name: keycloak
      namespace: keycloak
      port: 8080
---
# ============================================================================
# Protected routes: go through ext_authz (pep-proxy) and optionally ext_proc
# (resource-sync) for business routes.
#
# Envoy Gateway forwards request body (up to 8 KiB) to ext_authz so pep-proxy
# can extract resource IDs from JSON bodies (flexible API adaptation).
# ============================================================================

# ── Keycloak-proxy tenant/common/apps management ──────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-proxy-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/tenants
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/common
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/apps
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/permission-groups
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
---
# ── Identity management (groups / users / idp / api-keys / permissions / token) ───
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-api-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/groups(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/users(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/idp(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/api-keys(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/permissions(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
  - matches:
    - path:
        type: RegularExpression
        value: /api/v1/[^/]+/token(/.*)?
    backendRefs:
    - name: keycloak-proxy
      namespace: keycloak
      port: 8090
---
# ── Resource ACL API (resource-sync) ───────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acl-api-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /acl/v1
    backendRefs:
    - name: resource-sync
      namespace: resource-sync
      port: 8080
---
# ── Path rules CRUD (pep-proxy) ────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-rules-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/path-rules
    backendRefs:
    - name: pep-proxy
      namespace: opa
      port: 8000
{{- if .Values.mocks.kb.enabled }}
---
# ── Mock Knowledge Base ────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-kb-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /kb
    backendRefs:
    - name: mock-kb
      namespace: {{ .Values.mocks.kb.namespace }}
      port: 8080
{{- end }}
{{- if .Values.mocks.rubik.enabled }}
---
# ── Mock RubikSQL ──────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-rubik-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /rubik
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: mock-rubik
      namespace: {{ .Values.mocks.rubik.namespace }}
      port: 8081
{{- end }}
{{- if .Values.mocks.memory.enabled }}
---
# ── Mock UnifiedMem ────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-memory-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /memory
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: mock-memory
      namespace: {{ .Values.mocks.memory.namespace }}
      port: 8082
{{- end }}
---
# ── SecurityPolicy: ext_authz → pep-proxy (gRPC, with request body) ────────
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pep-proxy-extauthz
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: keycloak-proxy-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: identity-api-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: acl-api-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: path-rules-route
{{- if .Values.mocks.kb.enabled }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-kb-route
{{- end }}
{{- if .Values.mocks.rubik.enabled }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-rubik-route
{{- end }}
{{- if .Values.mocks.memory.enabled }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-memory-route
{{- end }}
  extAuth:
    grpc:
      backendRefs:
      - name: pep-proxy
        namespace: opa
        port: 9000
    failOpen: false
    bodyToExtAuth:
      maxRequestBytes: 8192
{{- if or .Values.mocks.kb.enabled (or .Values.mocks.rubik.enabled .Values.mocks.memory.enabled) }}
---
# ── EnvoyExtensionPolicy: ext_proc → resource-sync (streaming body) ────────
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: resource-sync-extproc
  namespace: envoy-gateway-system
spec:
  targetRefs:
{{- if .Values.mocks.kb.enabled }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-kb-route
{{- end }}
{{- if .Values.mocks.rubik.enabled }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-rubik-route
{{- end }}
{{- if .Values.mocks.memory.enabled }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mock-memory-route
{{- end }}
  extProc:
  - backendRefs:
    - name: resource-sync
      namespace: resource-sync
      port: 8082
    processingMode:
      request:
        body: Streamed
      response:
        body: Streamed
    failOpen: true
{{- end }}
{{- end }}
