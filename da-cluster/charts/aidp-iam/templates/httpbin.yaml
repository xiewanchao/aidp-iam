{{- if and .Values.routes.enabled .Values.routes.httpbin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: {{ .Values.routes.httpbin.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
      - name: httpbin
        image: {{ .Values.routes.httpbin.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /get
            port: 8080
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: {{ .Values.routes.httpbin.namespace }}
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8080
    name: http
  selector:
    app: httpbin
{{- end }}
