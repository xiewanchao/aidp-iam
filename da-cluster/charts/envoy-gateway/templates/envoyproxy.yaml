apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.name }}-config
  namespace: envoy-gateway-system
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.proxy.replicas }}
        container:
          image: {{ .Values.proxy.image }}
      envoyService:
        type: {{ .Values.proxy.service.type }}
        {{- if and (eq .Values.proxy.service.type "NodePort") .Values.proxy.service.nodePort }}
        # Strategic-merge patch to pin a fixed nodePort. Envoy Gateway's
        # envoyService field has no nodePort attribute — patch is the only
        # way. The merge key for Service.spec.ports[] is `port` (NOT `name`),
        # so `port: <gateway.port>` must be present in the patch element or
        # the controller rejects it with "does not contain declared merge key".
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              - name: http-{{ .Values.gateway.port }}
                port: {{ .Values.gateway.port }}
                nodePort: {{ .Values.proxy.service.nodePort }}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.gateway.name }}-config
    namespace: envoy-gateway-system
