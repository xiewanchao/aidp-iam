<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowhead_red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arrowhead_green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowhead_orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowhead_red_reverse" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowhead_green_reverse" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa" rx="8"/>

  <!-- ==================== Layer 1: Client ==================== -->
  <rect x="30" y="28" width="1140" height="42" rx="8" fill="#fff3bf" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="55" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">客户端 / WebUI (oidc-client-ts)  |  外部应用 (API Key / Client Credentials)</text>

  <!-- Arrow: Client -> Gateway -->
  <line x1="600" y1="70" x2="600" y2="95" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="618" y="88" font-size="11" fill="#666">HTTPS</text>

  <!-- ==================== Layer 2: Gateway ==================== -->
  <rect x="30" y="98" width="1140" height="232" rx="10" fill="#dbe4ff" fill-opacity="0.4" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="45" y="120" font-size="16" font-weight="bold" fill="#2563eb">Gateway 模块  envoy-gateway-system</text>

  <!-- === CRDs sub-box === -->
  <rect x="50" y="128" width="1100" height="50" rx="6" fill="#dbe4ff" fill-opacity="0.5" stroke="#4a9eed" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="62" y="159" font-size="13" fill="#4a9eed" font-weight="600">CRDs</text>
  <rect x="120" y="135" width="185" height="36" rx="6" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1" filter="url(#shadow)"/>
  <text x="212" y="158" text-anchor="middle" font-size="13" fill="#1e3a5f">Gateway</text>
  <rect x="315" y="135" width="185" height="36" rx="6" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1" filter="url(#shadow)"/>
  <text x="407" y="158" text-anchor="middle" font-size="13" fill="#1e3a5f">HTTPRoute</text>
  <rect x="510" y="135" width="185" height="36" rx="6" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1" filter="url(#shadow)"/>
  <text x="602" y="158" text-anchor="middle" font-size="13" fill="#1e3a5f">ReferenceGrant</text>
  <rect x="705" y="135" width="185" height="36" rx="6" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1" filter="url(#shadow)"/>
  <text x="797" y="158" text-anchor="middle" font-size="13" fill="#1e3a5f">SecurityPolicy</text>
  <rect x="900" y="135" width="235" height="36" rx="6" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1" filter="url(#shadow)"/>
  <text x="1017" y="158" text-anchor="middle" font-size="13" fill="#1e3a5f">EnvoyExtensionPolicy</text>

  <!-- === Controller sub-box === -->
  <rect x="50" y="188" width="1100" height="50" rx="6" fill="#e5dbff" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="62" y="219" font-size="13" fill="#8b5cf6" font-weight="600">控制面</text>
  <rect x="120" y="195" width="1015" height="36" rx="6" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="627" y="218" text-anchor="middle" font-size="14" fill="#3b0764">Gateway Controller  —  监听 CRD 变更, 生成 Envoy xDS 配置</text>

  <!-- === Data Plane sub-box === -->
  <rect x="50" y="248" width="1100" height="68" rx="6" fill="#dbe4ff" fill-opacity="0.5" stroke="#2563eb" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="62" y="288" font-size="13" fill="#2563eb" font-weight="600">数据面</text>

  <rect x="120" y="258" width="175" height="48" rx="6" fill="#a5d8ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="207" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">Envoy Proxy</text>
  <text x="207" y="296" text-anchor="middle" font-size="10" fill="#1e3a5f">TLS Terminate</text>
  <line x1="295" y1="282" x2="313" y2="282" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="313" y="258" width="175" height="48" rx="6" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="280" text-anchor="middle" font-size="13" fill="#1e3a5f">路由匹配</text>
  <text x="400" y="296" text-anchor="middle" font-size="10" fill="#1e3a5f">URL Rewrite</text>
  <line x1="488" y1="282" x2="506" y2="282" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="506" y="258" width="175" height="48" rx="6" fill="#ffc9c9" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="593" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">ext_authz Filter</text>
  <text x="593" y="296" text-anchor="middle" font-size="10" fill="#7f1d1d">请求阶段鉴权</text>
  <line x1="681" y1="282" x2="699" y2="282" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="699" y="258" width="195" height="48" rx="6" fill="#d3f9d8" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="796" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">ext_proc Filter</text>
  <text x="796" y="290" text-anchor="middle" font-size="10" fill="#14532d">请求: X-Allowed-Ids</text>
  <text x="796" y="302" text-anchor="middle" font-size="10" fill="#14532d">响应: ACL 同步</text>
  <line x1="894" y1="282" x2="912" y2="282" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="912" y="258" width="220" height="48" rx="6" fill="#b2f2bb" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="1022" y="280" text-anchor="middle" font-size="13" fill="#14532d">Header 注入</text>
  <text x="1022" y="296" text-anchor="middle" font-size="10" fill="#14532d">X-Auth-User-Id / Tenant / Groups</text>

  <!-- Vertical dashed connectors between sub-rows -->
  <line x1="600" y1="178" x2="600" y2="188" stroke="#8b8b8b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="600" y1="238" x2="600" y2="248" stroke="#8b8b8b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ==================== Arrows: Gateway(bottom=330) -> Layer3(top=390) ==================== -->

  <!-- Gateway -> Keycloak Server (center x=142) -->
  <line x1="180" y1="330" x2="180" y2="422" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="190" y="370" font-size="11" fill="#666">HTTP:8080</text>

  <!-- Gateway -> keycloak-proxy (center x=340) -->
  <line x1="340" y1="330" x2="340" y2="422" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="348" y="370" font-size="11" fill="#666">HTTP:8090</text>

  <!-- Gateway -> pep-proxy HTTP :8000 -->
  <line x1="580" y1="330" x2="580" y2="422" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="502" y="370" font-size="11" fill="#666">HTTP:8000</text>

  <!-- Gateway -> pep-proxy (center x=563) ext_authz bidirectional -->
  <line x1="610" y1="330" x2="610" y2="422" stroke="#ef4444" stroke-width="1.5" marker-start="url(#arrowhead_red_reverse)" marker-end="url(#arrowhead_red)"/>
  <text x="620" y="365" font-size="11" fill="#ef4444" font-weight="600">gRPC:9000</text>
  <text x="620" y="380" font-size="10" fill="#ef4444">ext_authz</text>

  <!-- Gateway -> resource-sync (center x=1007) ext_proc bidirectional -->
  <line x1="1007" y1="330" x2="1007" y2="422" stroke="#22c55e" stroke-width="1.5" marker-start="url(#arrowhead_green_reverse)" marker-end="url(#arrowhead_green)"/>
  <text x="1015" y="365" font-size="11" fill="#22c55e" font-weight="600">gRPC:8082</text>
  <text x="1015" y="380" font-size="10" fill="#22c55e">ext_proc</text>

  <!-- Gateway -> Applications (straight down at x=1150) -->
  <line x1="1152" y1="330" x2="1152" y2="630" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="1162" y="420" font-size="11" fill="#666" writing-mode="tb">直接路由 + X-Auth-* Headers</text>

  <!-- ==================== Layer 3a: Identity (Keycloak) ==================== -->
  <rect x="30" y="390" width="415" height="180" rx="10" fill="#ffd8a8" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="45" y="412" font-size="15" font-weight="bold" fill="#c2410c">身份模块  keycloak</text>

  <rect x="50" y="422" width="185" height="50" rx="6" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="142" y="443" text-anchor="middle" font-size="13" fill="#7c2d12">Keycloak Server</text>
  <text x="142" y="460" text-anchor="middle" font-size="10" fill="#9a3412">JWT 签发 / OIDC / SAML</text>

  <rect x="248" y="422" width="185" height="50" rx="6" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="340" y="440" text-anchor="middle" font-size="13" fill="#7c2d12">keycloak-proxy</text>
  <text x="340" y="455" text-anchor="middle" font-size="10" fill="#9a3412">用户/组/应用/IdP API</text>
  <text x="340" y="468" text-anchor="middle" font-size="10" fill="#9a3412">:8090</text>

  <rect x="50" y="484" width="185" height="34" rx="6" fill="#fff3bf" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="142" y="506" text-anchor="middle" font-size="12" fill="#92400e">SPI: structured-role-mapper</text>

  <rect x="248" y="484" width="185" height="34" rx="6" fill="#fff3bf" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="340" y="506" text-anchor="middle" font-size="12" fill="#92400e">keycloak-init Job</text>

  <rect x="50" y="530" width="383" height="24" rx="4" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="241" y="547" text-anchor="middle" font-size="11" fill="#b45309">groups: master-admins / tenant-admins / all-users / {app}-admins</text>

  <!-- ==================== Layer 3b: Auth & Policy ==================== -->
  <rect x="460" y="390" width="380" height="180" rx="10" fill="#d3f9d8" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5"/>
  <text x="475" y="412" font-size="15" font-weight="bold" fill="#15803d">鉴权模块  opa</text>

  <rect x="478" y="422" width="170" height="55" rx="6" fill="#b2f2bb" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="563" y="441" text-anchor="middle" font-size="13" fill="#14532d">pep-proxy</text>
  <text x="563" y="455" text-anchor="middle" font-size="10" fill="#166534">JWT 验证 + OPA 鉴权</text>
  <text x="563" y="469" text-anchor="middle" font-size="10" fill="#166534">resource_acl 查询</text>

  <rect x="660" y="422" width="170" height="55" rx="6" fill="#b2f2bb" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="745" y="441" text-anchor="middle" font-size="13" fill="#14532d">bundle-server</text>
  <text x="745" y="455" text-anchor="middle" font-size="10" fill="#166534">apps + path_rules</text>
  <text x="745" y="469" text-anchor="middle" font-size="10" fill="#166534">→ OPA bundle :8001</text>

  <rect x="478" y="490" width="352" height="42" rx="6" fill="#c3fae8" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="654" y="510" text-anchor="middle" font-size="13" fill="#14532d">OPA 策略引擎</text>
  <text x="654" y="525" text-anchor="middle" font-size="10" fill="#166534">app enabled? → path_rules? → groups?</text>

  <!-- pep-proxy -> OPA arrow -->
  <line x1="563" y1="477" x2="563" y2="490" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead_green)"/>
  <!-- bundle-server -> OPA arrow -->
  <line x1="745" y1="477" x2="745" y2="490" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead_green)"/>

  <!-- pep-proxy -> Keycloak JWKS -->
  <line x1="478" y1="445" x2="433" y2="445" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead_orange)"/>
  <text x="443" y="438" font-size="10" fill="#b45309">JWKS</text>

  <!-- ==================== Layer 3c: Resource Permissions ==================== -->
  <rect x="855" y="390" width="315" height="180" rx="10" fill="#e5dbff" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="870" y="412" font-size="15" font-weight="bold" fill="#6b21a8">资源权限模块</text>

  <rect x="875" y="422" width="275" height="55" rx="6" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="1012" y="441" text-anchor="middle" font-size="13" fill="#3b0764">resource-sync</text>
  <text x="1012" y="455" text-anchor="middle" font-size="10" fill="#4c1d95">ext_proc gRPC :8082</text>
  <text x="1012" y="469" text-anchor="middle" font-size="10" fill="#4c1d95">ACL 管理 API :8080</text>

  <rect x="875" y="490" width="130" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="940" y="510" text-anchor="middle" font-size="11" fill="#4c1d95">pending_acl</text>
  <text x="940" y="522" text-anchor="middle" font-size="9" fill="#6b21a8">后台重试</text>

  <rect x="1017" y="490" width="133" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="1083" y="510" text-anchor="middle" font-size="11" fill="#4c1d95">failOpen</text>
  <text x="1083" y="522" text-anchor="middle" font-size="9" fill="#6b21a8">宕机不阻塞业务</text>

  <rect x="875" y="538" width="275" height="20" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="1012" y="553" text-anchor="middle" font-size="10" fill="#6b21a8">ACL: owner / contributor / viewer / ...</text>

  <!-- ==================== Layer 4: Application ==================== -->
  <rect x="30" y="630" width="1140" height="50" rx="8" fill="#c3fae8" fill-opacity="0.5" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="45" y="660" font-size="15" font-weight="bold" fill="#0e7490">应用层  业务后端</text>

  <rect x="300" y="638" width="150" height="34" rx="6" fill="#c3fae8" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="375" y="660" text-anchor="middle" font-size="13" fill="#164e63">知识库</text>

  <rect x="470" y="638" width="150" height="34" rx="6" fill="#c3fae8" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="545" y="660" text-anchor="middle" font-size="13" fill="#164e63">记忆库</text>

  <rect x="640" y="638" width="150" height="34" rx="6" fill="#c3fae8" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="715" y="660" text-anchor="middle" font-size="13" fill="#164e63">智能问数</text>

  <rect x="810" y="638" width="150" height="34" rx="6" fill="#c3fae8" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="885" y="660" text-anchor="middle" font-size="13" fill="#164e63">App ...</text>

  <!-- ==================== Layer 5: Data ==================== -->
  <!-- DB arrows: straight down from each block bottom (y=570) to DB top (y=700) -->
  <line x1="237" y1="570" x2="237" y2="700" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="654" y1="570" x2="654" y2="700" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="1012" y1="570" x2="1012" y2="700" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <rect x="30" y="700" width="1140" height="55" rx="10" fill="#f1f3f5" fill-opacity="0.6" stroke="#868e96" stroke-width="1.5"/>
  <text x="45" y="733" font-size="15" font-weight="bold" fill="#495057">数据层  GaussDB</text>

  <rect x="350" y="710" width="470" height="34" rx="6" fill="#dee2e6" stroke="#868e96" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="728" text-anchor="middle" font-size="13" fill="#343a40">iam DB</text>
  <text x="585" y="741" text-anchor="middle" font-size="9" fill="#495057">groups | users | apps | path_rules | resource_patterns | resource_acl | pending_acl | api_keys</text>

  <!-- ==================== Legend ==================== -->
  <rect x="30" y="772" width="1140" height="55" rx="6" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="793" font-size="12" font-weight="600" fill="#666">图例:</text>

  <!-- Arrow legends - Row 1 -->
  <line x1="95" y1="790" x2="125" y2="790" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="130" y="794" font-size="11" fill="#666">数据/请求流</text>
  <line x1="230" y1="790" x2="260" y2="790" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowhead_red)"/>
  <text x="265" y="794" font-size="11" fill="#666">ext_authz (pep-proxy)</text>
  <line x1="415" y1="790" x2="445" y2="790" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowhead_green)"/>
  <text x="450" y="794" font-size="11" fill="#666">ext_proc (resource-sync)</text>
  <line x1="620" y1="790" x2="650" y2="790" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead_orange)"/>
  <text x="655" y="794" font-size="11" fill="#666">JWKS</text>
  <line x1="710" y1="790" x2="740" y2="790" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="745" y="794" font-size="11" fill="#666">数据库读写</text>

  <!-- Color legends - Row 2 -->
  <rect x="95" y="805" width="40" height="12" rx="3" fill="#dbe4ff" stroke="#4a9eed" stroke-width="0.5"/>
  <text x="140" y="816" font-size="11" fill="#666">Gateway模块</text>
  <rect x="215" y="805" width="40" height="12" rx="3" fill="#ffd8a8" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="260" y="816" font-size="11" fill="#666">身份模块</text>
  <rect x="310" y="805" width="40" height="12" rx="3" fill="#d3f9d8" stroke="#22c55e" stroke-width="0.5"/>
  <text x="355" y="816" font-size="11" fill="#666">鉴权模块</text>
  <rect x="405" y="805" width="40" height="12" rx="3" fill="#e5dbff" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="450" y="816" font-size="11" fill="#666">资源权限模块</text>
  <rect x="530" y="805" width="40" height="12" rx="3" fill="#c3fae8" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="575" y="816" font-size="11" fill="#666">应用层</text>
  <rect x="615" y="805" width="40" height="12" rx="3" fill="#dee2e6" stroke="#868e96" stroke-width="0.5"/>
  <text x="660" y="816" font-size="11" fill="#666">数据层</text>
</svg>
