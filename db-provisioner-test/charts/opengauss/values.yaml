# openGauss StatefulSet config
image:
  # Community-maintained image. Alternatives: opengauss/opengauss:5.0.0
  repository: enmotech/opengauss
  tag: "5.0.0"
  pullPolicy: IfNotPresent

service:
  port: 5432

storage:
  size: 2Gi

# Super user for the DB instance. Set by bootstrap hook on first install.
superSecret:
  name: opengauss-super
  namespace: opengauss
  # The non-omm user openGauss creates on init (GS_USERNAME).
  # This is also the role the provisioner uses to CREATE DATABASE / CREATE USER.
  username: gaussdb

# The image that runs both the bootstrap Job and the provisioner Job.
# Build with: ./images/db-provisioner/build.sh
provisionerImage:
  repository: db-provisioner
  tag: "local"
  pullPolicy: IfNotPresent  # IfNotPresent so kind-loaded image is used

# Per-application databases. Each entry creates:
#   - database <name>
#   - user <user> owning that database
#   - Secret <secretName> in <secretNamespace> with host/port/database/username/password
databases:
  - name: kb
    user: kb
    secretName: db-credentials-kb
    secretNamespace: knowledgebase
  - name: memory
    user: memory
    secretName: db-credentials-memory
    secretNamespace: memory
