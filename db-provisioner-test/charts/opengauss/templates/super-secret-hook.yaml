{{- /*
  pre-install hook: generate the openGauss super Secret if it does not exist.
  Existing Secrets are preserved (helm upgrade will not rotate the password).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: super-secret-generator
  namespace: {{ .Values.superSecret.namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: super-secret-generator
  namespace: {{ .Values.superSecret.namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: super-secret-generator
  namespace: {{ .Values.superSecret.namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
subjects:
  - kind: ServiceAccount
    name: super-secret-generator
    namespace: {{ .Values.superSecret.namespace }}
roleRef:
  kind: Role
  name: super-secret-generator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opengauss-super-secret-init
  namespace: {{ .Values.superSecret.namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: super-secret-generator
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ .Values.provisionerImage.repository }}:{{ .Values.provisionerImage.tag }}"
          imagePullPolicy: {{ .Values.provisionerImage.pullPolicy }}
          command: ["python", "/app/bootstrap.py"]
          env:
            - name: SUPER_SECRET_NAMESPACE
              value: {{ .Values.superSecret.namespace | quote }}
            - name: SUPER_SECRET_NAME
              value: {{ .Values.superSecret.name | quote }}
            - name: SUPER_USER
              value: {{ .Values.superSecret.username | quote }}
