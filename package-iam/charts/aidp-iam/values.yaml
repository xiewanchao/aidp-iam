# ============================================================================
# aidp-iam — IAM business stack values
# ============================================================================
# Each subchart deploys to its own (hardcoded) namespace.
# Override any subchart value with `<chart>.<key>=...`. The keycloak subchart
# uses `keycloak.keycloak.config.hostname` because the subchart's own values
# nest under `keycloak:` at its own root.
# ============================================================================

# ── Subchart toggles ────────────────────────────────────────────────────────
keycloak:
  enabled: true
  # Override examples (uncomment to use):
  # keycloak:
  #   config:
  #     hostname: http://141.112.135.70:30080
  # postgres:
  #   persistence:
  #     storageClass: dorado-inner-nas
  #     size: 10Gi

opa:
  enabled: true

resource-sync:
  enabled: true
  image:
    repository: resource-sync
    tag: v1
    pullPolicy: IfNotPresent

# ── Gateway routes ──────────────────────────────────────────────────────────
# The HTTPRoutes / SecurityPolicy / EnvoyExtensionPolicy / ReferenceGrants for
# the IAM control plane only. Real business app routes (KB / Rubik / ...) are
# NOT auto-generated — see package/examples/ for templates to copy.
routes:
  enabled: true
