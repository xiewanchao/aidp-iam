{{- define "aidp-iam.keycloakForwardedHeaderFilter" -}}
{{- if .Values.routes.keycloakForwardedHeaders.enabled }}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        {{- if .Values.routes.keycloakForwardedHeaders.proto }}
        - name: X-Forwarded-Proto
          value: {{ .Values.routes.keycloakForwardedHeaders.proto | quote }}
        {{- end }}
        {{- if .Values.routes.keycloakForwardedHeaders.host }}
        - name: X-Forwarded-Host
          value: {{ .Values.routes.keycloakForwardedHeaders.host | quote }}
        {{- end }}
        {{- if .Values.routes.keycloakForwardedHeaders.port }}
        - name: X-Forwarded-Port
          value: {{ .Values.routes.keycloakForwardedHeaders.port | quote }}
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.routes.enabled }}
{{/*
Public routes — no auth required.
Keycloak OIDC discovery, admin console UI, and static resources.
*/}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: {{ .Values.routes.gatewayNamespace }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /realms
{{ include "aidp-iam.keycloakForwardedHeaderFilter" . }}
    backendRefs:
    - name: keycloak
      namespace: keycloak
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin-route
  namespace: {{ .Values.routes.gatewayNamespace }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin
{{ include "aidp-iam.keycloakForwardedHeaderFilter" . }}
    backendRefs:
    - name: keycloak
      namespace: keycloak
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-static-route
  namespace: {{ .Values.routes.gatewayNamespace }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /resources
{{ include "aidp-iam.keycloakForwardedHeaderFilter" . }}
    backendRefs:
    - name: keycloak
      namespace: keycloak
      port: 8080
{{- end }}
