{{- if .Values.routes.enabled }}
{{/*
Protected IAM control-plane routes — go through ext_authz (pep-proxy).
SecurityPolicy in security-policy.yaml binds these to the extAuth backend.
Body forwarding (max 8 KiB) is enabled at the SecurityPolicy level so pep-proxy
can extract resource IDs from JSON request bodies.

v2.0: All IAM APIs are served under /AccessManager/. Legacy /api/v1/ routes removed.
*/}}
---
# Keycloak-proxy: /AccessManager/ unified API (v2.0)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-proxy-route
  namespace: {{ .Values.routes.gatewayNamespace }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /AccessManager
    backendRefs:
    - name: keycloak-proxy
      namespace: aidp-iam
      port: 8090
---
# Resource ACL legacy endpoint (resource-sync owns /acl/v1/)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acl-api-route
  namespace: {{ .Values.routes.gatewayNamespace }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /acl/v1
    backendRefs:
    - name: resource-sync
      namespace: aidp-iam
      port: 8080
{{- end }}
