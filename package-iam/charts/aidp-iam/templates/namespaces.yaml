{{/*
Namespaces for the IAM stack subcharts. envoy-gateway-system is created by
aidp-gateway, NOT here. Mock-* namespaces belong to aidp-iam-mocks.
*/}}
{{- range $ns := list "keycloak" "opa" "resource-sync" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "aidp-iam.labels" $ | nindent 4 }}
{{- end }}
