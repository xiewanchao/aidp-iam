{{/*
Namespaces for the IAM stack (v1.4 architecture):
  keycloak  — Keycloak StatefulSet + Postgres + keycloak-init Job
              (created here as a pre-install hook so it exists before any
              keycloak subchart resource lands)
  aidp-iam  — iam-services Pod + 5 Services + HTTPRoute backends
              (NOT created here — it is also the Helm release storage ns
              and gets created by the `helm install --create-namespace`
              flag. Putting it in this hook list with before-hook-creation
              would cascade-delete the release Secret on every install,
              leaving `helm list` empty and breaking upgrade/rollback.
              See v1.4.1 release notes for the cascade-delete root cause.)

aidp-gateway is created by aidp-gateway (not here).
Mock-* namespaces belong to the mock packages.
*/}}
{{- range $ns := list "keycloak" }}
{{- if not (lookup "v1" "Namespace" "" $ns) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "aidp-iam.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
