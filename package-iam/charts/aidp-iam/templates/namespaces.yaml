{{/*
Namespaces for the IAM stack.

The release namespace is created by `helm install --create-namespace`, so this
chart only owns the extra namespaces it needs. Do not render namespaces as Helm
hooks: `before-hook-creation` deletes the namespace on upgrade, which also
deletes PVCs and Keycloak data.
*/}}
{{- range $ns := list "keycloak" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "aidp-iam.labels" $ | nindent 4 }}
{{- end }}
