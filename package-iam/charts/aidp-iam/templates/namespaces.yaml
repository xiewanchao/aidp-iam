{{/*
Namespaces for the IAM stack (v1.4 architecture):
  keycloak  — Keycloak StatefulSet + Postgres + keycloak-init Job
  aidp-iam  — iam-services Pod (4 Python services + OPA), HTTPRoute backends
              for keycloak-proxy / pep-proxy / resource-sync

envoy-gateway-system is created by aidp-gateway (not here).
Mock-* namespaces belong to the mock packages.
*/}}
{{- range $ns := list "keycloak" "aidp-iam" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "aidp-iam.labels" $ | nindent 4 }}
{{- end }}
