{{- if .Values.routes.enabled }}
{{/*
ReferenceGrants — let HTTPRoutes / SecurityPolicies / EnvoyExtensionPolicies
in envoy-gateway-system reach Services in the IAM workload namespaces.

After v1.4 merger:
  - keycloak ns:  only public OIDC routes (routes-public.yaml) hit Services
                  here (Keycloak StatefulSet itself, not keycloak-proxy)
  - aidp-iam ns:  all 5 IAM service Services live here (keycloak-proxy,
                  pep-proxy, bundle-server, opa, resource-sync) — protected
                  routes + ext_authz SecurityPolicy reach them
*/}}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-keycloak
  namespace: keycloak
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-aidp-iam
  namespace: aidp-iam
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: envoy-gateway-system
  - group: gateway.envoyproxy.io
    kind: EnvoyExtensionPolicy
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
{{- end }}
