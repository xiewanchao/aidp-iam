apiVersion: v1
kind: Service
metadata:
  name: resource-sync
  namespace: resource-sync
  labels:
    app: resource-sync
    {{- include "resource-sync.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP
  - port: 8082
    targetPort: 8082
    name: grpc-extproc
    protocol: TCP
  selector:
    app: resource-sync
