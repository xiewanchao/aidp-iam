# ============================================================================
# iam-app — 4 Python services + OPA in one Pod (single Deployment)
# ============================================================================

namespace: aidp-iam

# ── HA defaults ────────────────────────────────────────────────────────────
# replicas=2 + hard podAntiAffinity = "two Pods MUST land on two different
# nodes". On a multi-node cluster you get cross-node HA automatically with
# zero config tweak. On a single-node cluster the second Pod stays Pending
# — the first Pod still serves traffic, IAM is functional but degraded.
# To collapse back to single-Pod for single-node dev, override:
#   --set iam-app.replicas=1 --set iam-app.podAntiAffinity.enabled=false
replicas: 2

podAntiAffinity:
  enabled: true
  hard: true

# ── Image: combined Python services (4-in-1 supervisord) ───────────────────
appImage:
  repository: aidp-iam-app
  tag: v1
  pullPolicy: IfNotPresent

# ── Image: OPA standalone policy engine ────────────────────────────────────
# Use the `-static` variant (distroless, multi-arch). The plain `:0.70.0`
# tag on Docker Hub publishes only linux/amd64, which causes
# `exec format error` on arm64 nodes (Huawei Atlas, Kunpeng). The
# `-static` tag is a manifest list with both linux/amd64 and linux/arm64.
opaImage:
  repository: openpolicyagent/opa
  tag: "0.70.0-static"
  pullPolicy: IfNotPresent

# ── wait-for-aidp-client-secret initContainer (DISABLED by default) ───────
# This initContainer was originally added on the assumption that the main
# container would crash if the Secret wasn't ready. Turns out kubelet's
# native handling of `secretKeyRef` already does the right thing: when the
# referenced Secret doesn't exist yet, the Pod stays in
# CreateContainerConfigError and kubelet retries every ~10s with backoff
# until the Secret appears (then the next retry succeeds). No extra
# initContainer needed.
#
# Enabled by default so a plain Helm install waits for keycloak-init to write
# the final aidp-client Secret for this release revision before iam-services
# starts and reads KC_CLIENT_SECRET from env.
#
# On clusters where Pod network can't resolve kubernetes.default.svc by DNS
# (multus / Huawei Atlas / dorado-cni split networks), override host:
#   --set iam-app.waitForSecret.apiServerHost=10.96.0.1   # actual ClusterIP
waitForSecret:
  enabled: true
  apiServerHost: "kubernetes.default.svc"
  apiServerPort: "443"

# ── Resources for the merged Pod (4 Python procs in one container) ─────────
resources:
  requests:
    cpu: "300m"
    memory: "400Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

# ── OPA container resources (lightweight) ──────────────────────────────────
opaResources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# ── Connection URLs ────────────────────────────────────────────────────────
db:
  iam: "postgresql://keycloak:keycloak@postgres.keycloak.svc.cluster.local:5432/iam"

keycloak:
  url: "http://keycloak.keycloak.svc.cluster.local:8080"
  healthUrl: "http://keycloak.keycloak.svc.cluster.local:9000"
  realm: "aidp"
  clientId: "aidp-client"
  newClientId: "data-agent"
  # Secret holding aidp-client client_id/secret. Written by keycloak-init Job
  # (cross-ns from keycloak ns into this aidp-iam ns).
  clientSecretName: "keycloak-aidp-client"

# ── OPA process settings ──────────────────────────────────────────────────
opa:
  logLevel: "info"
  logFormat: "json"
