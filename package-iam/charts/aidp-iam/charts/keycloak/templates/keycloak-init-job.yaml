{{/*
keycloak-init Job: bootstraps the aidp realm + writes the aidp-client
Secret. After v1.4 the IAM services run in the `aidp-iam` namespace,
so this Job needs cross-namespace write permission to put the Secret
where iam-services can read it.

ttlSecondsAfterFinished=300 auto-cleans the completed Pod after 5 min
so it doesn't sit on a maxPods slot.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-init-sa
  namespace: keycloak
automountServiceAccountToken: true
---
# Existing role: write the legacy keycloak-credentials Secret etc. inside
# the keycloak namespace itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-init-secret-role
  namespace: keycloak
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-init-secret-binding
  namespace: keycloak
subjects:
- kind: ServiceAccount
  name: keycloak-init-sa
  namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-init-secret-role
  apiGroup: rbac.authorization.k8s.io
---
# NEW: cross-ns role allowing init Job to write the aidp-client Secret
# into the aidp-iam namespace where iam-services consumes it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-init-aidp-iam-secret-writer
  namespace: aidp-iam
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-init-aidp-iam-secret-writer
  namespace: aidp-iam
subjects:
- kind: ServiceAccount
  name: keycloak-init-sa
  namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-init-aidp-iam-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init-{{ .Release.Revision }}
  namespace: keycloak
  labels:
    app: keycloak
    component: init-job
    release-revision: {{ .Release.Revision | quote }}
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300            # auto-GC the completed Pod after 5 min
  template:
    spec:
      serviceAccountName: keycloak-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
      - name: keycloak-init
        image: "{{ .Values.keycloakInit.image.repository }}:{{ .Values.keycloakInit.image.tag }}"
        imagePullPolicy: {{ .Values.keycloakInit.image.pullPolicy }}
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak:8080"
        - name: KEYCLOAK_HEALTH_URL
          value: "http://keycloak:9000"
        - name: ADMIN_USER
          value: "{{ .Values.keycloak.admin.username }}"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-password
        - name: AIDP_REALM
          value: "{{ .Values.keycloakInit.realm }}"
        - name: AIDP_CLIENT_ID
          value: "{{ .Values.keycloakInit.clientId }}"
        - name: K8S_SECRET_NAME
          value: "{{ .Values.keycloakInit.secretName }}"
        - name: K8S_NAMESPACE
          value: "aidp-iam"                # ← v1.4: write Secret to iam-services ns
        - name: AIDP_RELEASE_REVISION
          value: "{{ .Release.Revision }}"
        - name: AIDP_ADMIN_USER
          value: "{{ .Values.keycloakInit.adminUser }}"
        - name: AIDP_ADMIN_PASSWORD
          value: "{{ .Values.keycloakInit.adminPassword }}"
        - name: AIDP_NORMAL_USER
          value: "{{ .Values.keycloakInit.normalUser }}"
        - name: AIDP_NORMAL_PASSWORD
          value: "{{ .Values.keycloakInit.normalPassword }}"
        - name: IAM_DB_URL
          value: "postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@postgres.keycloak.svc.cluster.local:{{ .Values.postgres.port }}/iam"
        resources:
          limits:
            cpu: "100m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init-secret-cleanup
  namespace: keycloak
  labels:
    app: keycloak
    component: cleanup-job
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: keycloak-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
      - name: keycloak-init-secret-cleanup
        image: "{{ .Values.keycloakInit.image.repository }}:{{ .Values.keycloakInit.image.tag }}"
        imagePullPolicy: {{ .Values.keycloakInit.image.pullPolicy }}
        env:
        - name: TARGET_NAMESPACE
          value: "aidp-iam"
        - name: TARGET_SECRET
          value: "{{ .Values.keycloakInit.secretName }}"
        command: ["python", "-c"]
        args:
        - |
          import os
          from kubernetes import client, config
          from kubernetes.client.rest import ApiException

          namespace = os.environ["TARGET_NAMESPACE"]
          secret = os.environ["TARGET_SECRET"]

          config.load_incluster_config()
          api = client.CoreV1Api()
          try:
              api.delete_namespaced_secret(secret, namespace)
              print(f"deleted secret {namespace}/{secret}")
          except ApiException as exc:
              if exc.status == 404:
                  print(f"secret {namespace}/{secret} already absent")
              else:
                  raise
