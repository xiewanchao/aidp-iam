{{/*
keycloak-init Job: bootstraps the aidp realm + writes the aidp-client
Secret. After v1.4 the IAM services run in the `aidp-iam` namespace,
so this Job needs cross-namespace write permission to put the Secret
where iam-services can read it.

ttlSecondsAfterFinished=300 auto-cleans the completed Pod after 5 min
so it doesn't sit on a maxPods slot.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-init-sa
  namespace: keycloak
automountServiceAccountToken: true
---
# Existing role: write the legacy keycloak-credentials Secret etc. inside
# the keycloak namespace itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-init-secret-role
  namespace: keycloak
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-init-secret-binding
  namespace: keycloak
subjects:
- kind: ServiceAccount
  name: keycloak-init-sa
  namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-init-secret-role
  apiGroup: rbac.authorization.k8s.io
---
# NEW: cross-ns role allowing init Job to write the aidp-client Secret
# into the aidp-iam namespace where iam-services consumes it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-init-aidp-iam-secret-writer
  namespace: aidp-iam
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-init-aidp-iam-secret-writer
  namespace: aidp-iam
subjects:
- kind: ServiceAccount
  name: keycloak-init-sa
  namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-init-aidp-iam-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init
  namespace: keycloak
  labels:
    app: keycloak
    component: init-job
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300            # auto-GC the completed Pod after 5 min
  template:
    spec:
      serviceAccountName: keycloak-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
      - name: keycloak-init
        image: "{{ .Values.keycloakInit.image.repository }}:{{ .Values.keycloakInit.image.tag }}"
        imagePullPolicy: {{ .Values.keycloakInit.image.pullPolicy }}
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak:8080"
        - name: KEYCLOAK_HEALTH_URL
          value: "http://keycloak:9000"
        - name: ADMIN_USER
          value: "{{ .Values.keycloak.admin.username }}"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-password
        - name: AIDP_REALM
          value: "{{ .Values.keycloakInit.realm }}"
        - name: AIDP_CLIENT_ID
          value: "{{ .Values.keycloakInit.clientId }}"
        - name: K8S_SECRET_NAME
          value: "{{ .Values.keycloakInit.secretName }}"
        - name: K8S_NAMESPACE
          value: "aidp-iam"                # ← v1.4: write Secret to iam-services ns
        - name: AIDP_ADMIN_USER
          value: "{{ .Values.keycloakInit.adminUser }}"
        - name: AIDP_ADMIN_PASSWORD
          value: "{{ .Values.keycloakInit.adminPassword }}"
        - name: AIDP_NORMAL_USER
          value: "{{ .Values.keycloakInit.normalUser }}"
        - name: AIDP_NORMAL_PASSWORD
          value: "{{ .Values.keycloakInit.normalPassword }}"
        - name: IAM_DB_URL
          value: "postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@postgres.keycloak.svc.cluster.local:{{ .Values.postgres.port }}/iam"
        resources:
          limits:
            cpu: "100m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"
