apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: keycloak
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  create-opal-db.sql: |
    -- Create the opal database for OPAL Server pub/sub
    SELECT 'CREATE DATABASE opal OWNER {{ .Values.postgres.auth.username }}'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'opal')\gexec
  create-iam-db.sql: |
    -- Create the iam database for IAM v2.0
    SELECT 'CREATE DATABASE iam OWNER {{ .Values.postgres.auth.username }}'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'iam')\gexec

    -- Connect to iam database and create tables
    \c iam

    -- apps: Application registry (system-level, no tenant_id)
    CREATE TABLE IF NOT EXISTS apps (
        app_name     VARCHAR(128) PRIMARY KEY,
        path_prefix  VARCHAR(256) NOT NULL UNIQUE,
        display_name VARCHAR(256),
        description  VARCHAR(512),
        admin_group  VARCHAR(128),   -- 应用管理员组名（如 kb-admins, rubik-admins）
        enabled      BOOLEAN      NOT NULL DEFAULT true,
        created_at   TIMESTAMP    NOT NULL DEFAULT NOW(),
        updated_at   TIMESTAMP    NOT NULL DEFAULT NOW()
    );

    -- resource_patterns: Resource matching + ID extraction + creation-time ACL behavior
    --   method: '' (empty) = fallback for all methods; 'GET'/'POST'/... = method-specific rule
    --   lookup order in pep-proxy / resource-sync: (app, prefix, method) first, then (app, prefix, '')
    --   share_to_admin_group_on_create: on 2xx create, also insert (group, apps.admin_group, owner)
    --   share_to_all_users_on_create:   on 2xx create, also insert (group, all-users, viewer)
    --   creator (subject_type=user) is always written as owner — these two bools are additive rows.
    CREATE TABLE IF NOT EXISTS resource_patterns (
        app_name                         VARCHAR(128) NOT NULL REFERENCES apps(app_name),
        resource_prefix                  VARCHAR(256) NOT NULL,
        method                           VARCHAR(10)  NOT NULL DEFAULT '',
        resource_type                    VARCHAR(128) NOT NULL,
        id_source                        VARCHAR(16)  NOT NULL DEFAULT 'path',
        id_field                         VARCHAR(128) NOT NULL DEFAULT 'id',
        id_query_param                   VARCHAR(128) DEFAULT NULL,
        -- response_id_field: override id_field when extracting from response body
        -- (for 2xx create events). NULL = fall back to id_field (default behavior).
        -- Useful when the backend's request field and response field differ,
        -- e.g. KB uses request `kbs_id` but response `data.KDSID` (different
        -- naming convention + nesting). Dotted nested keys supported.
        response_id_field                VARCHAR(128) DEFAULT NULL,
        share_to_admin_group_on_create   BOOLEAN      NOT NULL DEFAULT false,
        share_to_all_users_on_create     BOOLEAN      NOT NULL DEFAULT false,
        list_filter_mode                 VARCHAR(32)  NOT NULL DEFAULT 'gateway_inject',
        PRIMARY KEY (app_name, resource_prefix, method)
    );
    -- Back-compat: add response_id_field to pre-existing installs.
    ALTER TABLE resource_patterns
        ADD COLUMN IF NOT EXISTS response_id_field VARCHAR(128) DEFAULT NULL;
    -- Back-compat: add list_filter_mode to pre-existing installs.
    ALTER TABLE resource_patterns
        ADD COLUMN IF NOT EXISTS list_filter_mode VARCHAR(32) NOT NULL DEFAULT 'gateway_inject';

    -- resource_actions: Action identification + permission rules (system-level)
    -- Empty table means "use code default rules for standard RESTful".
    -- NOTE: no FK to resource_patterns anymore (pattern PK now includes method, not
    -- compatible with a plain (app_name, resource_prefix) FK). Referential consistency
    -- between the two is enforced at seed time / application level.
    CREATE TABLE IF NOT EXISTS resource_actions (
        id              SERIAL PRIMARY KEY,
        app_name        VARCHAR(128) NOT NULL,
        resource_prefix VARCHAR(256) NOT NULL,
        action          VARCHAR(32)  NOT NULL,
        method          VARCHAR(16)  NOT NULL,
        path_suffix     VARCHAR(256) DEFAULT NULL,
        success_status  INTEGER      DEFAULT NULL,
        min_permission  VARCHAR(32)  NOT NULL DEFAULT 'none'
    );
    CREATE INDEX IF NOT EXISTS idx_ra_app_prefix ON resource_actions (app_name, resource_prefix);

    -- permission_groups: 业务功能点（"option"）
    -- 一个功能点聚合若干 (path_prefix, method)，并被授予给一组 Keycloak 组。
    -- UI 上每个功能点是一个可勾选项；bundle-server 读取这三张表合成 OPA 的扁平 data.path_rules。
    -- app_name='' 表示跨 app / 平台级（iam_admin, acl_access 等）。
    CREATE TABLE IF NOT EXISTS permission_groups (
        id          SERIAL PRIMARY KEY,
        app_name    VARCHAR(128) NOT NULL DEFAULT '',
        name        VARCHAR(128) NOT NULL,
        description VARCHAR(512),
        created_at  TIMESTAMP    NOT NULL DEFAULT NOW(),
        UNIQUE (app_name, name)
    );

    -- permission_group_paths: 每个功能点包含哪些 (path_prefix, method)
    -- method NULL 表示匹配所有 HTTP 方法（PK 不能含 NULL，这里用 SERIAL id + UNIQUE 实现）
    CREATE TABLE IF NOT EXISTS permission_group_paths (
        id          SERIAL PRIMARY KEY,
        group_id    INTEGER NOT NULL REFERENCES permission_groups(id) ON DELETE CASCADE,
        path_prefix VARCHAR(256) NOT NULL,
        method      VARCHAR(10),
        UNIQUE (group_id, path_prefix, method)
    );
    CREATE INDEX IF NOT EXISTS idx_pgp_group ON permission_group_paths (group_id);

    -- permission_group_bindings: 功能点开给哪些 Keycloak 组（N:M）
    CREATE TABLE IF NOT EXISTS permission_group_bindings (
        group_id      INTEGER      NOT NULL REFERENCES permission_groups(id) ON DELETE CASCADE,
        kc_group_name VARCHAR(128) NOT NULL,
        PRIMARY KEY (group_id, kc_group_name)
    );
    CREATE INDEX IF NOT EXISTS idx_pgb_kc_group ON permission_group_bindings (kc_group_name);

    -- resource_acl: Resource permissions (tenant-level, v2.0 path-based)
    CREATE TABLE IF NOT EXISTS resource_acl (
        id          SERIAL PRIMARY KEY,
        tenant_id   VARCHAR(128) NOT NULL,
        user_path   VARCHAR(512) NOT NULL,
        object_path VARCHAR(512) NOT NULL,
        role_path   VARCHAR(512) NOT NULL,
        created_by  VARCHAR(512),
        created_at  TIMESTAMP    NOT NULL DEFAULT NOW(),
        UNIQUE (tenant_id, user_path, object_path)
    );
    CREATE INDEX IF NOT EXISTS idx_acl_object ON resource_acl (tenant_id, object_path);
    CREATE INDEX IF NOT EXISTS idx_acl_user   ON resource_acl (tenant_id, user_path);

    -- pending_acl: Retry queue for failed ACL writes (v2.0 path-based)
    CREATE TABLE IF NOT EXISTS pending_acl (
        id          SERIAL PRIMARY KEY,
        action      VARCHAR(16)  NOT NULL,
        tenant_id   VARCHAR(128) NOT NULL,
        user_path   VARCHAR(512) NOT NULL,
        object_path VARCHAR(512) NOT NULL,
        role_path   VARCHAR(512),
        created_by  VARCHAR(512),
        retry_count INTEGER      NOT NULL DEFAULT 0,
        max_retries INTEGER      NOT NULL DEFAULT 10,
        last_error  TEXT,
        created_at  TIMESTAMP    NOT NULL DEFAULT NOW(),
        next_retry  TIMESTAMP    NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_pending_retry ON pending_acl (next_retry) WHERE retry_count < max_retries;

    -- app_manifests: Application manifest registry (system-level)
    CREATE TABLE IF NOT EXISTS app_manifests (
        namespace       VARCHAR(128) PRIMARY KEY,
        base_url        VARCHAR(512),
        callback_url    VARCHAR(512),
        manifest_json   TEXT         NOT NULL,
        registered_at   TIMESTAMP    NOT NULL DEFAULT NOW()
    );

    -- api_keys: API Key management (tenant-level)
    CREATE TABLE IF NOT EXISTS api_keys (
        id              VARCHAR(64)  PRIMARY KEY,
        api_key_hash    VARCHAR(256) NOT NULL UNIQUE,
        key_prefix      VARCHAR(16)  NOT NULL,
        tenant_id       VARCHAR(128) NOT NULL,
        app_name        VARCHAR(128) NOT NULL,
        description     VARCHAR(512),
        subject_id      VARCHAR(128) NOT NULL,
        subject_type    VARCHAR(32)  NOT NULL DEFAULT 'service',
        allowed_paths   TEXT[],
        rate_limit      INTEGER      DEFAULT 100,
        expires_at      TIMESTAMP,
        enabled         BOOLEAN      NOT NULL DEFAULT true,
        created_by      VARCHAR(128) NOT NULL,
        created_at      TIMESTAMP    NOT NULL DEFAULT NOW(),
        updated_at      TIMESTAMP    NOT NULL DEFAULT NOW(),
        last_used_at    TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_apikey_hash ON api_keys (api_key_hash);
    CREATE INDEX IF NOT EXISTS idx_apikey_tenant ON api_keys (tenant_id);

    -- Default seed data previously written by keycloak-init. Keep it here so
    -- keycloak-init does not need a Python PostgreSQL driver.
    INSERT INTO apps (app_name, path_prefix, display_name, description, admin_group, enabled) VALUES
        ('KnowledgeBase', '/KnowledgeBase/', 'Knowledge Base',  'Knowledge base management (manifest-registered)', NULL, true),
        ('DataAgent',     '/DataAgent/',     'Data Agent',      'NL2SQL data query platform (manifest-registered)', NULL, true),
        ('MemoryStore',   '/MemoryStore/',   'Memory Store',    'Memory service (manifest-registered)',              NULL, true)
    ON CONFLICT (app_name) DO UPDATE SET
        path_prefix  = EXCLUDED.path_prefix,
        display_name = EXCLUDED.display_name,
        description  = EXCLUDED.description,
        enabled      = EXCLUDED.enabled;

    INSERT INTO permission_groups (app_name, name, description) VALUES
        ('', 'iam_admin',      'IAM system management API (master-admins only)'),
        ('', 'access_manager', 'AccessManager API (master-admins + tenant-admins)')
    ON CONFLICT (app_name, name) DO UPDATE SET
        description = EXCLUDED.description;

    WITH src(name, path_prefix, method) AS (
        VALUES
            ('iam_admin',      '/AccessManager/Tenants/System/', NULL::VARCHAR),
            ('access_manager', '/AccessManager/',                NULL::VARCHAR)
    )
    INSERT INTO permission_group_paths (group_id, path_prefix, method)
    SELECT pg.id, src.path_prefix, src.method
    FROM src
    JOIN permission_groups pg ON pg.app_name = '' AND pg.name = src.name
    WHERE NOT EXISTS (
        SELECT 1
        FROM permission_group_paths existing
        WHERE existing.group_id = pg.id
          AND existing.path_prefix = src.path_prefix
          AND existing.method IS NOT DISTINCT FROM src.method
    );

    WITH src(name, kc_group_name) AS (
        VALUES
            ('iam_admin',      'master-admins'),
            ('access_manager', 'master-admins'),
            ('access_manager', 'tenant-admins')
    )
    INSERT INTO permission_group_bindings (group_id, kc_group_name)
    SELECT pg.id, src.kc_group_name
    FROM src
    JOIN permission_groups pg ON pg.app_name = '' AND pg.name = src.name
    ON CONFLICT DO NOTHING;
