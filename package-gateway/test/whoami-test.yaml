# ============================================================================
# Gateway 端到端验证用例 —— whoami 后端 + HTTPRoute + ReferenceGrant
#
# 部署完 aidp-gateway 后，apply 这个文件再 curl，验证流量真的能从外部
# NodePort 30080 经 Envoy 落到一个真实业务后端。
#
# 用 traefik/whoami 这个镜像（很小、稳定、回显请求详情，是社区标准的
# Gateway 验证用后端）。如果你的集群离线、没法 pull traefik/whoami，
# 把 image 改成你已有的任何返回 HTTP 200 的后端镜像即可。
# ============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: test-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: test-backend
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
---
# 把 /whoami 前缀路由到上面 whoami Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-route
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /whoami
    backendRefs:
    - name: whoami
      namespace: test-backend
      port: 80
---
# 允许 envoy-gateway-system 的 HTTPRoute 跨 ns 引用 test-backend 的 Service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-whoami
  namespace: test-backend
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
