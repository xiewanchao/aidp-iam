apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
spec:
  telemetry:
    accessLog:
      settings:
      - type: Route
        sinks:
        - type: File
          file:
            path: /dev/stdout
        format:
          type: JSON
          json:
            start_time: "%START_TIME%"
            method: "%REQ(:METHOD)%"
            path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
            protocol: "%PROTOCOL%"
            response_code: "%RESPONSE_CODE%"
            response_flags: "%RESPONSE_FLAGS%"
            duration: "%DURATION%"
            upstream_host: "%UPSTREAM_HOST%"
            x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
            user_agent: "%REQ(USER-AGENT)%"
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.proxy.replicas }}
        container:
          image: {{ .Values.proxy.image }}
        {{- if .Values.proxy.hostNetwork }}
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
        {{- end }}
      envoyService:
        type: {{ .Values.proxy.service.type }}
        externalTrafficPolicy: {{ .Values.proxy.service.externalTrafficPolicy }}
        {{- if .Values.proxy.service.externalIPs }}
        externalIPs:
          {{- toYaml .Values.proxy.service.externalIPs | nindent 8 }}
        {{- end }}
        {{- if and (eq .Values.proxy.service.type "NodePort") (or .Values.proxy.service.nodePort (and .Values.gateway.tls.enabled .Values.proxy.service.httpsNodePort)) }}
        # Strategic-merge patch to pin a fixed nodePort.
        # Service.spec.ports[] uses `port` as the merge key (NOT `name`),
        # so `port: <gateway.port>` MUST be present alongside `nodePort`.
        # Port name is auto-generated as "http-<port>" from the Gateway listener.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              {{- if .Values.proxy.service.nodePort }}
              - name: http-{{ .Values.gateway.port }}
                port: {{ .Values.gateway.port }}
                nodePort: {{ .Values.proxy.service.nodePort }}
              {{- end }}
              {{- if and .Values.gateway.tls.enabled .Values.proxy.service.httpsNodePort }}
              - name: https-{{ .Values.gateway.tls.port }}
                port: {{ .Values.gateway.tls.port }}
                nodePort: {{ .Values.proxy.service.httpsNodePort }}
              {{- end }}
        {{- end }}
