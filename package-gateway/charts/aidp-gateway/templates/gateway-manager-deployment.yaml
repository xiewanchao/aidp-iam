{{- if .Values.gatewayManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-manager
spec:
  replicas: {{ .Values.gatewayManager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aidp-gateway.gatewayManagerName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aidp-gateway.gatewayManagerName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway-manager
    spec:
      serviceAccountName: {{ include "aidp-gateway.gatewayManagerName" . }}
      automountServiceAccountToken: true
      containers:
      - name: gateway-manager
        image: "{{ .Values.gatewayManager.image.repository }}:{{ .Values.gatewayManager.image.tag }}"
        imagePullPolicy: {{ .Values.gatewayManager.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: GATEWAY_CERT_NAMESPACE
          value: {{ default .Release.Namespace .Values.gatewayManager.certificate.secretNamespace | quote }}
        - name: GATEWAY_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: GATEWAY_MANAGER_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: GATEWAY_NAME
          value: {{ .Values.gateway.name | quote }}
        - name: GATEWAY_CERT_SECRET_PREFIX
          value: {{ .Values.gatewayManager.certificate.secretPrefix | quote }}
        - name: LOG_STATUS_CONFIGMAP_NAME
          value: {{ .Values.gatewayManager.logCollect.statusConfigMapName | quote }}
        - name: LOG_TMP_DIR
          value: {{ .Values.gatewayManager.logCollect.tmpDir | quote }}
        - name: LOG_ARCHIVE_RETENTION_SECONDS
          value: {{ .Values.gatewayManager.logCollect.archiveRetentionSeconds | quote }}
        - name: LOG_ARCHIVE_MAX_FILES
          value: {{ .Values.gatewayManager.logCollect.archiveMaxFiles | quote }}
        volumeMounts:
        - name: gateway-log-collect-tmp
          mountPath: {{ .Values.gatewayManager.logCollect.tmpDir | quote }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        resources:
          {{- toYaml .Values.gatewayManager.resources | nindent 10 }}
      volumes:
      - name: gateway-log-collect-tmp
        emptyDir:
          sizeLimit: {{ .Values.gatewayManager.logCollect.tmpSizeLimit | quote }}
{{- end }}
