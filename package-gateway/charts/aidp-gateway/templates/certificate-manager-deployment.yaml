{{- if .Values.certificateManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aidp-gateway.certManagerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-manager
spec:
  replicas: {{ .Values.certificateManager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aidp-gateway.certManagerName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aidp-gateway.certManagerName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: certificate-manager
    spec:
      serviceAccountName: {{ include "aidp-gateway.certManagerName" . }}
      automountServiceAccountToken: true
      containers:
      - name: certificate-manager
        image: "{{ .Values.certificateManager.image.repository }}:{{ .Values.certificateManager.image.tag }}"
        imagePullPolicy: {{ .Values.certificateManager.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: GATEWAY_CERT_NAMESPACE
          value: {{ default .Release.Namespace .Values.certificateManager.secretNamespace | quote }}
        - name: GATEWAY_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: GATEWAY_NAME
          value: {{ .Values.gateway.name | quote }}
        - name: GATEWAY_CERT_SECRET_PREFIX
          value: {{ .Values.certificateManager.secretPrefix | quote }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        resources:
          {{- toYaml .Values.certificateManager.resources | nindent 10 }}
{{- end }}
