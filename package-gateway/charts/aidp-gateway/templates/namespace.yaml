{{/*
envoy-gateway-system namespace where Gateway / EnvoyProxy / GatewayClass,
HTTPRoutes, SecurityPolicy, and EnvoyExtensionPolicy live.

Do not render this namespace as a Helm hook. A hook with
before-hook-creation deletes the namespace on upgrade, which removes gateway
resources before the new release is applied.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
