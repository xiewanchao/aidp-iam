{{- if and .Values.gateway.tls.enabled .Values.gateway.tls.bootstrap.enabled }}
{{- $secretName := required "gateway.tls.secretName is required when gateway.tls.enabled=true" .Values.gateway.tls.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if not $existing }}
{{- $cn := default "aidp-gateway.local" .Values.gateway.tls.bootstrap.commonName -}}
{{- $dnsNames := default (list $cn "localhost") .Values.gateway.tls.bootstrap.dnsNames -}}
{{- $ipAddresses := default (list "127.0.0.1") .Values.gateway.tls.bootstrap.ipAddresses -}}
{{- $days := int (default 365 .Values.gateway.tls.bootstrap.validityDays) -}}
{{- $cert := genSelfSignedCert $cn $ipAddresses $dnsNames $days -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
    gateway.aidp.io/certificate-alias: {{ .Values.gateway.tls.bootstrap.alias | quote }}
  annotations:
    gateway.aidp.io/certificate-alias: {{ .Values.gateway.tls.bootstrap.alias | quote }}
    gateway.aidp.io/display-name: "Bootstrap Self-Signed Gateway Certificate"
    gateway.aidp.io/product-name: "AIDP"
    gateway.aidp.io/is-preset: "true"
    gateway.aidp.io/bootstrap: "true"
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
{{- end }}
{{- end }}
