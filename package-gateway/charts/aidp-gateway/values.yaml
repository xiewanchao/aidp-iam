# ============================================================================
# aidp-gateway — Envoy Gateway infrastructure
# ============================================================================

# Upstream Envoy Gateway controller (chart `gateway-helm` v1.7.2).
# Its CRDs were stripped from the vendored tgz; we ship the stripped versions
# under aidp-gateway/crds/ which Helm auto-applies on first install.
gateway-helm:
  enabled: true
  certgen:
    job:
      annotations:
        "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    rbac:
      annotations:
        "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  topologyInjector:
    enabled: false
  deployment:
    envoyGateway:
      image:
        repository: docker.io/envoyproxy/gateway
        tag: v1.7.2
      imagePullPolicy: IfNotPresent

# Gateway / EnvoyProxy / GatewayClass parameters
gateway:
  # Listener name + port. Service auto-creates a port called "http-<port>".
  name: eg
  className: eg
  port: 80
  tls:
    # Disabled by default because the referenced Secret must exist before
    # Envoy Gateway can program the HTTPS listener.
    enabled: false
    port: 443
    hostname: ""
    secretName: ""

gatewayManager:
  enabled: true
  image:
    repository: gateway-manager
    tag: v1
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    name: gateway-manager
    port: 8080
  certificate:
    # Empty means use the Helm release namespace.
    secretNamespace: ""
    secretPrefix: gw-cert-
  logCollect:
    statusConfigMapName: aidp-gateway-log-collect-status
    tmpDir: /tmp/gateway-log-collect
    tmpSizeLimit: 1Gi
    archiveRetentionSeconds: 86400
    archiveMaxFiles: 5
  resources: {}

cleanup:
  # Runs as a Helm pre-delete hook so a plain `helm uninstall` first deletes
  # the Gateway while the Envoy Gateway controller is still alive.
  enabled: true
  timeoutSeconds: 300
  pollIntervalSeconds: 2
  image:
    repository: docker.io/alpine/kubectl
    tag: "1.34.1"
    pullPolicy: IfNotPresent
  resources: {}

proxy:
  image: docker.io/envoyproxy/envoy:v1.36.5
  imagePullPolicy: IfNotPresent
  replicas: 1

  # ── Service exposure ────────────────────────────────────────────────────
  # NodePort + fixed nodePort 30080 is the default (suits bare-metal/EIP).
  # Switch to ClusterIP when an external LB / ingress already fronts the
  # cluster, or LoadBalancer on managed clusters.
  service:
    type: NodePort
    nodePort: 30080
    httpsNodePort: 30443
    # Optional: bind one or more external IPs directly to the Service.
    # Useful for Huawei / bare-metal where you want the EIP routed via
    # K8s rather than NodePort. Mutually exclusive with NodePort in
    # most setups — verify with your network admin.
    externalIPs: []
    # Cluster (default) or Local. Local preserves source IP but breaks
    # cross-node routing when EIP is bound to a different node than the
    # envoy pod. Keep as Cluster unless you know what you're doing.
    externalTrafficPolicy: Cluster

  # ── Host-network mode ───────────────────────────────────────────────────
  # When true, the envoy data-plane pod uses the node's network namespace.
  # Listens on `gateway.port` (80) directly on every node — no NodePort
  # remapping, no kube-proxy hop. Useful when:
  #   - the cluster has no NodePort range usable from outside (some PaaS)
  #   - you want lowest-latency / best source-IP fidelity
  # Caveats: only one envoy pod per node, port 80 must be free on every
  # node, and the pod needs hostNetwork tolerated by the cluster's PSA.
  hostNetwork: false
