syntax = "proto3";

package envoy.service.ext_proc.v3;

import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/duration.proto";

service ExternalProcessor {
  rpc Process(stream ProcessingRequest) returns (stream ProcessingResponse) {}
}

// ---------------------------------------------------------------------------
// Top-level request / response
// ---------------------------------------------------------------------------

message ProcessingRequest {
  oneof request {
    HttpHeaders request_headers = 2;
    HttpBody request_body = 3;
    HttpHeaders response_headers = 4;
    HttpBody response_body = 5;
    HttpTrailers request_trailers = 6;
    HttpTrailers response_trailers = 7;
  }
  ProcessingMode mode_override = 8;
  // 9 = async_mode (not needed)
  map<string, google.protobuf.Struct> metadata_context = 10;
  // 11 = attributes
  bool observability_mode = 12;
}

message ProcessingResponse {
  oneof response {
    HeadersResponse request_headers = 1;
    BodyResponse request_body = 2;
    HeadersResponse response_headers = 3;
    BodyResponse response_body = 4;
    TrailersResponse request_trailers = 5;
    TrailersResponse response_trailers = 6;
    ImmediateResponse immediate_response = 7;
  }
  ProcessingMode mode_override = 8;
  google.protobuf.Duration override_message_timeout = 9;
}

// ---------------------------------------------------------------------------
// Processing mode (used for mode_override to request body buffering, etc.)
// ---------------------------------------------------------------------------

message ProcessingMode {
  enum HeaderSendMode {
    DEFAULT = 0;
    SEND = 1;
    SKIP = 2;
  }
  enum BodySendMode {
    NONE = 0;
    STREAMED = 1;
    BUFFERED = 2;
    BUFFERED_PARTIAL = 3;
    FULL_DUPLEX_STREAMED = 4;
  }
  HeaderSendMode request_header_mode = 1;
  BodySendMode request_body_mode = 2;
  HeaderSendMode response_header_mode = 3;
  BodySendMode response_body_mode = 4;
  HeaderSendMode request_trailer_mode = 5;
  HeaderSendMode response_trailer_mode = 6;
}

// ---------------------------------------------------------------------------
// HTTP phase messages (from Envoy -> ext_proc)
// ---------------------------------------------------------------------------

message HttpHeaders {
  HeaderMap headers = 1;
  map<string, google.protobuf.Struct> attributes = 2;
  bool end_of_stream = 3;
}

message HttpBody {
  bytes body = 1;
  bool end_of_stream = 2;
}

message HttpTrailers {
  HeaderMap headers = 1;
}

// ---------------------------------------------------------------------------
// Phase responses (ext_proc -> Envoy)
// ---------------------------------------------------------------------------

message HeadersResponse {
  CommonResponse response = 1;
}

message BodyResponse {
  CommonResponse response = 1;
}

message TrailersResponse {
  HeaderMutation header_mutation = 1;
}

message ImmediateResponse {
  HttpStatus status = 1;
  HeaderMutation headers = 2;
  string body = 3;
  GrpcStatus grpc_status = 4;
  string details = 5;
}

message HttpStatus {
  uint32 code = 1;
}

message GrpcStatus {
  uint32 status = 1;
}

// ---------------------------------------------------------------------------
// Common response building blocks
// ---------------------------------------------------------------------------

message CommonResponse {
  enum ResponseStatus {
    CONTINUE = 0;
    CONTINUE_AND_REPLACE = 1;
  }
  ResponseStatus status = 1;
  HeaderMutation header_mutation = 2;
  BodyMutation body_mutation = 3;
  HeaderMap trailers = 4;
  bool clear_route_cache = 5;
}

message HeaderMutation {
  repeated HeaderValueOption set_headers = 1;
  repeated string remove_headers = 2;
}

message BodyMutation {
  oneof mutation {
    bytes body = 1;
    bool clear_body = 2;
    StreamedResponse streamed_response = 3;
  }
}

message StreamedResponse {
  bytes body = 1;
  bool end_of_stream = 2;
}

// ---------------------------------------------------------------------------
// Core header types (envoy.config.core.v3 — inlined)
// ---------------------------------------------------------------------------

message HeaderMap {
  repeated HeaderValue headers = 1;
}

message HeaderValue {
  string key = 1;
  string value = 2;
  bytes raw_value = 3;
}

message HeaderValueOption {
  HeaderValue header = 1;
  google.protobuf.BoolValue append = 2;
  HeaderAppendAction append_action = 3;
  bool keep_empty_value = 4;
}

enum HeaderAppendAction {
  APPEND_IF_EXISTS_OR_ADD = 0;
  ADD_IF_ABSENT = 1;
  OVERWRITE_IF_EXISTS_OR_ADD = 2;
  OVERWRITE_IF_EXISTS = 3;
}
