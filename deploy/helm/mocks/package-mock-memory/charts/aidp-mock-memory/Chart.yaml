apiVersion: v2
name: aidp-mock-memory
description: |
  Mock MemoryBank backend for AIDP IAM. Wraps mock-memory FastAPI image
  + HTTPRoute (/MemoryBank prefix) + ReferenceGrant + SecurityPolicy + EnvoyExtensionPolicy
  in a single Helm release.

  Doubles as:
    - IAM platform e2e test pod (verify ext_authz / ext_proc / ACL auto-sync for MemoryBank)
    - Standard chart structure reference for multi-resource apps with sub-resources

  Requires aidp-gateway and aidp-iam already installed. MemoryBank app row is
  seeded by the Postgres init script; resource_patterns / path_rules are written
  by the manifest PUT in the test setup phase.
type: application
version: 1.0.0
appVersion: "1.0.0"
