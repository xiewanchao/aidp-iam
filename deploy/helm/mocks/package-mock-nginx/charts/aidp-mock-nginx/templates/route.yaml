apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentinfra-frontend-route
  namespace: {{ .Values.gatewayNamespace }}
  labels:
    {{- include "aidp-mock-nginx.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.pathPrefix }}
    backendRefs:
    - name: {{ .Values.backend.service }}
      namespace: {{ .Values.backend.namespace }}
      port: {{ .Values.backend.port }}
