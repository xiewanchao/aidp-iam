apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-kb-route
  namespace: {{ .Values.gatewayNamespace }}
  labels:
    {{- include "aidp-mock-kb.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.pathPrefix }}
    backendRefs:
    - name: mock-kb
      namespace: {{ .Values.namespace }}
      port: {{ .Values.port }}
