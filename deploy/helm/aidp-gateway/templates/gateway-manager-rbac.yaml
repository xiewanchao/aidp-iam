{{- if .Values.gatewayManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-certificates
  namespace: {{ default (include "aidp-gateway.gatewayNamespace" .) .Values.gatewayManager.certificate.secretNamespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-certificates
  namespace: {{ default (include "aidp-gateway.gatewayNamespace" .) .Values.gatewayManager.certificate.secretNamespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "aidp-gateway.gatewayManagerName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-certificates
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "aidp-gateway.gatewayManagerName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-log-reader
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "gatewayclasses", "httproutes", "referencegrants"]
  verbs: ["get", "list"]
- apiGroups: ["gateway.envoyproxy.io"]
  resources: ["envoyproxies", "securitypolicies", "envoyextensionpolicies", "backendtrafficpolicies", "clienttrafficpolicies"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-log-reader
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "aidp-gateway.gatewayManagerName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aidp-gateway.gatewayManagerName" . }}-log-reader
{{- end }}
