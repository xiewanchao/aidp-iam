{{- $gatewayNamespace := include "aidp-gateway.gatewayNamespace" . -}}
{{- if and (ne $gatewayNamespace .Release.Namespace) (not (lookup "v1" "Namespace" "" $gatewayNamespace)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $gatewayNamespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
{{- end }}
