apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidp-gateway.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gateway.name }}-config
  listeners:
  - name: http
    protocol: HTTP
    port: {{ .Values.gateway.port }}
    allowedRoutes:
      namespaces:
        from: All
  {{- if .Values.gateway.tls.enabled }}
  - name: https
    protocol: HTTPS
    port: {{ .Values.gateway.tls.port }}
    {{- if .Values.gateway.tls.hostname }}
    hostname: {{ .Values.gateway.tls.hostname | quote }}
    {{- end }}
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: {{ required "gateway.tls.secretName is required when gateway.tls.enabled=true" .Values.gateway.tls.secretName | quote }}
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
