{{- $iamNs := include "iam-app.namespace" . -}}
{{/*
RBAC for iam-services Pod:
  - The Pod's initContainer needs to *list/get* Secrets in the
    iam-app namespace to wait for keycloak-init to write the
    aidp-client Secret cross-ns.
  - Runtime container reads that Secret via env's secretKeyRef
    (no API calls), so doesn't need additional RBAC for that.

The cross-ns *write* RBAC for keycloak-init Job lives in the keycloak
subchart (keycloak-init-job.yaml) — it's bound TO this namespace.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-services
  namespace: {{ $iamNs }}
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-services-secret-reader
  namespace: {{ $iamNs }}
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-services-secret-reader
  namespace: {{ $iamNs }}
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: iam-services
  namespace: {{ $iamNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iam-services-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-services-log-state
  namespace: {{ $iamNs }}
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-services-log-state
  namespace: {{ $iamNs }}
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: iam-services
  namespace: {{ $iamNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iam-services-log-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-iam-services-log-reader
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "events"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "referencegrants", "gateways", "gatewayclasses"]
  verbs: ["get", "list"]
- apiGroups: ["gateway.envoyproxy.io"]
  resources: ["securitypolicies", "envoyextensionpolicies", "envoyproxies", "backendtrafficpolicies", "clienttrafficpolicies"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-iam-services-log-reader
  labels:
    {{- include "iam-app.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: iam-services
  namespace: {{ $iamNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-iam-services-log-reader
