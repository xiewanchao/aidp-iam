{{/*
keycloak-init Job: bootstraps the aidp realm + writes the aidp-client
Secret into the iam-services namespace.

ttlSecondsAfterFinished=300 auto-cleans the completed Pod after 5 min
so it doesn't sit on a maxPods slot.
*/}}
{{- $keycloakNs := include "keycloak.namespace" . -}}
{{- $iamNs := include "keycloak.iamNamespace" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-init-sa
  namespace: {{ $keycloakNs }}
automountServiceAccountToken: true
---
# Existing role: write Secrets inside the Keycloak namespace itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-init-secret-role
  namespace: {{ $keycloakNs }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ .Values.keycloakInit.security.machineTokenConfigMapName | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-init-secret-binding
  namespace: {{ $keycloakNs }}
subjects:
- kind: ServiceAccount
  name: keycloak-init-sa
  namespace: {{ $keycloakNs }}
roleRef:
  kind: Role
  name: keycloak-init-secret-role
  apiGroup: rbac.authorization.k8s.io
---
# Cross-namespace role allowing init Job to write the aidp-client Secret
# into the iam-services namespace where the app consumes it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-init-client-secret-writer
  namespace: {{ $iamNs }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-init-client-secret-writer
  namespace: {{ $iamNs }}
subjects:
- kind: ServiceAccount
  name: keycloak-init-sa
  namespace: {{ $keycloakNs }}
roleRef:
  kind: Role
  name: keycloak-init-client-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init-{{ .Release.Revision }}
  namespace: {{ $keycloakNs }}
  labels:
    app: keycloak
    component: init-job
    release-revision: {{ .Release.Revision | quote }}
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300            # auto-GC the completed Pod after 5 min
  template:
    spec:
      serviceAccountName: keycloak-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
      - name: keycloak-init
        image: "{{ .Values.keycloakInit.image.repository }}:{{ .Values.keycloakInit.image.tag }}"
        imagePullPolicy: {{ .Values.keycloakInit.image.pullPolicy }}
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak:8080"
        - name: KEYCLOAK_HEALTH_URL
          value: "http://keycloak:9000"
        - name: SECRET_BACKEND
          value: {{ .Values.keycloakInit.security.secretBackend | quote }}
        - name: MACHINE_TOKEN_PROVIDER
          value: {{ .Values.keycloakInit.security.machineTokenProvider | quote }}
        - name: KMS_BASE_URL
          value: {{ .Values.keycloakInit.security.kmsBaseUrl | quote }}
        - name: KMS_API_PREFIX
          value: {{ .Values.keycloakInit.security.kmsApiPrefix | quote }}
        - name: KMS_AUTH_TOKEN
          value: {{ .Values.keycloakInit.security.kmsAuthToken | quote }}
        - name: KMS_USER_NAME
          value: {{ .Values.keycloakInit.security.kmsUserName | quote }}
        - name: KMS_VERIFY_TLS
          value: {{ .Values.keycloakInit.security.kmsVerifyTls | quote }}
        - name: KMS_TIMEOUT_SECONDS
          value: {{ .Values.keycloakInit.security.kmsTimeoutSeconds | quote }}
        - name: PROTECT_CLIENT_SECRET
          value: {{ .Values.keycloakInit.security.protectClientSecret | quote }}
        - name: MACHINE_TOKEN_NAMESPACE
          value: {{ .Values.keycloakInit.security.machineTokenNamespace | quote }}
        - name: MACHINE_TOKEN_SECRET_NAME
          value: {{ .Values.keycloakInit.security.machineTokenSecretName | quote }}
        - name: MACHINE_TOKEN_CONFIGMAP_NAME
          value: {{ .Values.keycloakInit.security.machineTokenConfigMapName | quote }}
        - name: MOCK_KMS_STORE_PATH
          value: {{ .Values.keycloakInit.security.mockKmsStorePath | quote }}
        - name: MOCK_KMC_TOKEN
          value: {{ .Values.keycloakInit.security.mockKmcToken | quote }}
        - name: ADMIN_USER
          value: "{{ .Values.keycloak.admin.username }}"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-password
        - name: AIDP_REALM
          value: "{{ .Values.keycloakInit.realm }}"
        - name: AIDP_CLIENT_ID
          value: "{{ .Values.keycloakInit.clientId }}"
        - name: AIDP_WEB_CLIENT_ID
          value: "{{ .Values.keycloakInit.webClientId }}"
        - name: AIDP_CAS_CLIENT_ID
          value: "{{ .Values.keycloakInit.casClientId }}"
        - name: AIDP_CAS_REDIRECT_URIS
          value: {{ .Values.keycloakInit.casRedirectUris | join "," | quote }}
        - name: AIDP_LOGIN_THEME
          value: "{{ .Values.keycloakInit.loginTheme }}"
        - name: AIDP_WEB_REDIRECT_URIS
          value: {{ .Values.keycloakInit.webRedirectUris | join "," | quote }}
        - name: AIDP_WEB_POST_LOGOUT_REDIRECT_URIS
          value: {{ .Values.keycloakInit.webPostLogoutRedirectUris | join "," | quote }}
        - name: AIDP_WEB_WEB_ORIGINS
          value: {{ .Values.keycloakInit.webOrigins | join "," | quote }}
        - name: K8S_SECRET_NAME
          value: "{{ .Values.keycloakInit.secretName }}"
        - name: K8S_NAMESPACE
          value: {{ $iamNs | quote }}
        - name: AIDP_RELEASE_REVISION
          value: "{{ .Release.Revision }}"
        - name: AIDP_ADMIN_USER
          value: "{{ .Values.keycloakInit.adminUser }}"
        - name: AIDP_ADMIN_PASSWORD
          value: "{{ .Values.keycloakInit.adminPassword }}"
        - name: AIDP_NORMAL_USER
          value: "{{ .Values.keycloakInit.normalUser }}"
        - name: AIDP_NORMAL_PASSWORD
          value: "{{ .Values.keycloakInit.normalPassword }}"
        - name: IAM_DB_URL
          value: {{ include "keycloak.iamDbUrl" . | quote }}
        resources:
          limits:
            cpu: "100m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init-secret-cleanup
  namespace: {{ $keycloakNs }}
  labels:
    app: keycloak
    component: cleanup-job
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: keycloak-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
      - name: keycloak-init-secret-cleanup
        image: "{{ .Values.keycloakInit.image.repository }}:{{ .Values.keycloakInit.image.tag }}"
        imagePullPolicy: {{ .Values.keycloakInit.image.pullPolicy }}
        env:
        - name: TARGET_NAMESPACE
          value: {{ $iamNs | quote }}
        - name: TARGET_SECRET
          value: "{{ .Values.keycloakInit.secretName }}"
        command: ["python", "-c"]
        args:
        - |
          import os
          from kubernetes import client, config
          from kubernetes.client.rest import ApiException

          namespace = os.environ["TARGET_NAMESPACE"]
          secret = os.environ["TARGET_SECRET"]

          config.load_incluster_config()
          api = client.CoreV1Api()
          try:
              api.delete_namespaced_secret(secret, namespace)
              print(f"deleted secret {namespace}/{secret}")
          except ApiException as exc:
              if exc.status == 404:
                  print(f"secret {namespace}/{secret} already absent")
              else:
                  raise
