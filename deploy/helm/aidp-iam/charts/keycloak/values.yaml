namespaceOverride: ""
iamNamespaceOverride: ""

keycloak:
  replicas: 2
  image:
    repository: keycloak-custom
    tag: 26.5.2
    pullPolicy: IfNotPresent
  admin:
    username: admin
    password: admin
  resources:
    limits:
      cpu: 2000m
      memory: 2000Mi
    requests:
      cpu: 500m
      memory: 1700Mi
  config:
    # ==========================================================================
    # Hostname mode (Keycloak 26)
    # --------------------------------------------------------------------------
    # hostname empty (default)  → fully dynamic. OIDC URLs follow the request's
    #                             Host header. Works for SSH tunnel
    #                             (localhost:8088), EIP (1.2.3.4:30080), or DNS
    #                             (iam.example.com) — all without config.
    #                             KC_PROXY_HEADERS=xforwarded; Keycloak reads
    #                             X-Forwarded-Proto/Port from Gateway.
    # hostname = "<URL>"          → strict mode, all OIDC URLs hardcoded.
    #                             Use for production with stable DNS.
    # ==========================================================================
    hostname: ""                # default: dynamic; set to e.g. https://iam.example.com for strict mode
    backchannelDynamic: "true"  # only used when hostname is set; auto-forced to false in dynamic mode
    proxyHeaders: "xforwarded"  # Gateway sets X-Forwarded-* headers for HTTPS NodePort access
    httpEnabled: "true"
    hostnameStrict: "false"     # accept any Host (must be false for dynamic mode)
    healthEnabled: "true"
    cache: ispn
    db:
      type: postgres
      host: iam-store
      database: keycloak
      username: keycloak

postgres:
  replicas: 1
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    username: keycloak
    password: keycloak
    databases:
      - keycloak
      - opal
      - iam
  port: 5432
  persistence:
    enabled: true
    size: 10Gi
    # Explicit storageClass has highest priority. When this is empty and
    # autoSelectPreferredStorageClass is true, the chart checks whether
    # preferredStorageClass exists in the cluster during helm install/upgrade.
    # If it exists, storageClassName is set to that value; otherwise the field
    # is omitted and the cluster default StorageClass is used.
    storageClass: ""
    autoSelectPreferredStorageClass: true
    preferredStorageClass: dorado-inner-nas

keycloakInit:
  image:
    repository: keycloak-init
    tag: v2
    pullPolicy: IfNotPresent
  realm: "aidp"
  clientId: "aidp-client"
  webClientId: "aidp-web"
  loginTheme: "password-reset-confirm"
  # Same-origin browser redirects for aidp-web. Relative paths avoid baking
  # deployment-specific IP/host/port into the release package.
  webRedirectUris:
    - "/auth/login/callback"
  webPostLogoutRedirectUris:
    - "/auth/login"
  webOrigins:
    - "+"
  secretName: "keycloak-aidp-client"
  adminUser: "admin"
  adminPassword: "Admin@123"
  normalUser: "normal-user"
  normalPassword: "NormalUser@123"
