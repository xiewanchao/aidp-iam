{{- if .Values.routes.enabled }}
{{- $gatewayNs := include "aidp-iam.gatewayNamespace" . }}
{{- $keycloakNs := include "aidp-iam.keycloakNamespace" . }}
{{- $iamNs := include "aidp-iam.iamNamespace" . }}
{{/*
ReferenceGrants let HTTPRoutes / SecurityPolicies / EnvoyExtensionPolicies
in the Gateway namespace reach Services in the IAM workload namespaces.
*/}}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-keycloak
  namespace: {{ $keycloakNs }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ $gatewayNs }}
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-iam-services
  namespace: {{ $iamNs }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ $gatewayNs }}
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: {{ $gatewayNs }}
  - group: gateway.envoyproxy.io
    kind: EnvoyExtensionPolicy
    namespace: {{ $gatewayNs }}
  to:
  - group: ""
    kind: Service
{{- end }}
