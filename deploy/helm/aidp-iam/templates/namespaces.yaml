{{/*
Namespaces for the IAM stack.

Default behavior: Keycloak/Postgres and iam-app use .Release.Namespace.
That namespace must be created by `helm install --create-namespace` or by a
parent chart. Do not create .Release.Namespace here because hook-based
namespace recreation can cascade-delete Helm release Secrets.

Compatibility override behavior: if keycloakNamespaceOverride or
iamNamespaceOverride points to a namespace different from .Release.Namespace,
create it as a pre-install/pre-upgrade hook so subchart resources can land.

aidp-gateway is created by aidp-gateway (not here) unless IAM routes are
configured to use the release namespace.
*/}}
{{- $namespaces := dict -}}
{{- $_ := set $namespaces (include "aidp-iam.keycloakNamespace" .) true -}}
{{- $_ := set $namespaces (include "aidp-iam.iamNamespace" .) true -}}
{{- range $ns, $_ := $namespaces }}
{{- if and $ns (ne $ns $.Release.Namespace) (not (lookup "v1" "Namespace" "" $ns)) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "aidp-iam.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
