# ============================================================================
# aidp-iam — IAM business stack values (v1.4 merged-architecture)
# ============================================================================
# Two subcharts:
#   keycloak  — Keycloak StatefulSet + Postgres + keycloak-init Job
#   iam-app   — 4 Python services + OPA in one Pod
# Override any subchart value with `<chart>.<key>=...`.
# By default, Keycloak/Postgres and iam-app deploy into .Release.Namespace.
# A parent chart can therefore place all IAM resources into its own namespace.
# ============================================================================

# ── keycloak subchart ───────────────────────────────────────────────────────
keycloak:
  enabled: true
  # Empty means use Helm .Release.Namespace.
  namespaceOverride: ""
  iamNamespaceOverride: ""
  # Override examples (uncomment to use):
  # keycloak:
  #   config:
  #     hostname: https://141.112.135.70:30080
  # postgres:
  #   persistence:
  #     storageClass: dorado-inner-nas
  #     size: 10Gi

# ── iam-app subchart (4 Python services + OPA in one Pod) ───────────────────
# DaemonSet: one Pod per node, upgrades replace one node at a time (no Pending).
iam-app:
  enabled: true
  # Empty means use Helm .Release.Namespace.
  namespace: ""
  # appImage:
  #   tag: v1
  # opaImage:
  #   tag: 0.42.2-rootless

# ── Gateway routes (templates/ at this chart root) ──────────────────────────
# The HTTPRoutes / SecurityPolicy / ReferenceGrants for the IAM control plane
# only. Real business app routes (KB / Rubik / ...) are NOT auto-generated —
# see package/examples/ for templates to copy.
routes:
  enabled: true
  # IAM HTTPRoutes and SecurityPolicy live with the Gateway object.
  gatewayNamespace: aidp-gateway
  keycloakForwardedHeaders:
    # Optional override for Keycloak behind Gateway TLS termination.
    # Useful when the external HTTPS port is a NodePort, for example
    # https://localhost:30080, and Keycloak runs without KC_HOSTNAME.
    enabled: true
    proto: "https"
    host: ""
    port: "30080"
  # IAM ext_authz body buffer is fixed by templates at 1 MiB. It is an
  # internal control-plane default, not an upgrade-stable user override.
